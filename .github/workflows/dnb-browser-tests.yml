name: Astréon browser checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'dnb/**'
      - 'school/worker-dnb-candidate.js'
      - 'school/migration-dnb.sql'
      - 'school/migration-dnb-revision.sql'
      - 'school/schema.sql'
      - '.github/workflows/dnb-browser-tests.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node dnb/tests/maths.mjs
      - run: node --experimental-sqlite dnb/tests/server.mjs
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 > /tmp/astreon-http.log 2>&1 &
      - run: node dnb/tests/smoke.mjs
      - run: node dnb/tests/workshops.mjs
      - run: node dnb/tests/studio.mjs
      - run: node dnb/tests/encounters.mjs
      - run: node dnb/tests/clairval.mjs
      - run: node dnb/tests/dungeons.mjs
      - run: node dnb/tests/secrets.mjs
      - run: node dnb/tests/life.mjs
