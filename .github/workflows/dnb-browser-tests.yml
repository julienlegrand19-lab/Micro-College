name: Astréon browser checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'dnb/**'
      - '.github/workflows/dnb-browser-tests.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 > /tmp/astreon-http.log 2>&1 &
      - run: node dnb/tests/smoke.mjs
