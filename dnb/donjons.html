function home(){stop();d=null;A=null;world=read('astreon-clairval-v1')||{};app.innerHTML='<section class="panel"><h2>Choisis ton expédition</h2><p>Les passages secrets s’ouvrent après les missions des habitants de Clairval.</p><div class="cards">'+E.data.map(q=>{let a=S.areas[q.id],ok=E.allowed(q.id,world.done);return '<article class="tile"><canvas data-preview="'+q.id+'" width="572" height="416" aria-hidden="true"></canvas><h3>'+esc(q.name)+'</h3><p class="muted">'+(ok?(a?.solved||0)+'/3 salles · '+(a?.relic?'Relique acquise':esc(q.relic)):'Entrée fermée : termine la mission de '+({potion:'Lyra',ladder:'Orion',mirror:'Euclide'}[q.requires])+'.')+'</p><button data-dungeon="'+q.id+'" '+(!ok?'disabled':'')+'>'+(a?.relic?'Explorer à nouveau':'Entrer')+'</button></article>'}).join('')+'</div><p>'+E.data.filter(q=>S.areas[q.id]?.relic).length+'/3 reliques découvertes.</p></section>';

function target(){return A.solved>A.room?(A.room===2?E.chest:E.door):E.device}

function loop(t){if(!d)return;if(!document.hidden&&!dialog.open){if(moving&&t-moving.start>=moving.duration){A.pos=moving.to;moving=null;save();update();if(!route.length&&goal){msg('Tu es arrivé.');goal=''}}if(!moving){if(held)step([A.pos[0]+held[0],A.pos[1]+held[1]],t);else if(route.length)step(route.shift(),t)}}if(!document.hidden&&t-lastPaint>=33){paint(t);lastPaint=t}raf=requestAnimationFrame(loop)}
