<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astréon — Ateliers secrets</title><style>
:root{color-scheme:dark;--gold:#edc990;--ink:#f4e8d7;--muted:#c0cdd8;--line:#6c8499}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#34485b,#111e2c 65%);color:var(--ink);font:16px/1.5 system-ui,sans-serif;min-height:100vh}main{max-width:980px;margin:auto;padding:16px}h1,h2,h3{font-family:Georgia,serif;color:var(--gold);line-height:1.2}h1{font-size:clamp(26px,6vw,42px);margin:10px 0}h2{font-size:23px;margin:6px 0}p{margin:8px 0}.muted{color:var(--muted);font-size:13px}.tag{color:var(--gold);letter-spacing:.1em;text-transform:uppercase;font-size:12px}.panel{background:linear-gradient(145deg,#293b4e,#192938);border:1px solid #9a8562;border-radius:14px;padding:15px;margin:12px 0;box-shadow:0 6px 20px #0004}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button,a.button{font:inherit;font-weight:650;min-height:44px;border:1px solid #bba67c;border-radius:8px;padding:10px 13px;background:#e8c68b;color:#142332;cursor:pointer;text-decoration:none}button.secondary,a.secondary{background:#30465a;color:var(--ink);border-color:#8194a7}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #a2dcff;outline-offset:2px}.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:10px}.tile{background:#1b2c3a;border:1px solid #8194a7;padding:12px;border-radius:12px}.tile svg{width:100%;height:auto;border-radius:8px}.tile h3{margin:8px 0}.tile button{width:100%}.board{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}.scene{border:1px solid #7d94a6;background:#172b3b;border-radius:10px;overflow:hidden}.scene svg{display:block;width:100%;height:auto}.controls{min-width:0}.dose-row{display:flex;align-items:center;gap:6px;margin:10px 0}.dose-row>div{flex:1;min-width:0}.dose-row strong{display:block}.dose-row small{color:var(--muted)}.dose-row button{min-width:44px;padding:8px}.dose-value{min-width:32px;text-align:center;font-size:20px;font-variant-numeric:tabular-nums}.progress{height:10px;border-radius:6px;background:#101d28;overflow:hidden;margin:5px 0}.progress i{display:block;background:#d7ac6e;height:100%}.status{min-height:2em;padding:8px;border-left:3px solid #93a6b8;background:#1a2938;border-radius:4px}.good{color:#b4edc8;border-color:#78c39c}.bad{color:#ffd0b5;border-color:#db9871}.range{width:100%;accent-color:#e5c28a;min-height:44px}.readout{font-size:25px;font-weight:750;font-variant-numeric:tabular-nums;color:var(--gold)}.program{display:flex;flex-wrap:wrap;gap:5px;min-height:55px;padding:8px;background:#101e2b;border:1px dashed #8ca2b4;border-radius:8px}.program button{font-size:12px;padding:7px;min-height:44px;background:#386fc0;border-color:#709bce;color:white}.program button.current{outline:2px solid #ffd58a}.program .empty{color:var(--muted)}.palette{display:flex;gap:6px;flex-wrap:wrap}.palette button{background:#386fc0;border-color:#709bce;color:white;flex:1 1 85px;font-size:13px}.mini-nav{display:flex;gap:5px;flex-wrap:wrap}.mini-nav button{min-width:44px}.mini-nav button.done{background:#30654d;color:white;border-color:#9ccead}.mini-nav button.current{outline:2px solid #edc990}.mission-notes{font-size:14px}.seal{color:var(--gold);font-size:22px}.data{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.data>div{padding:8px;background:#172b3b;border-radius:8px}.data strong{display:block;color:#f1d09b;font-size:20px}.data small{font-size:12px;color:var(--muted)}@media(max-width:680px){main{padding:9px}.panel{padding:11px}.board{grid-template-columns:1fr}.scene{max-width:100%}.dose-row{gap:4px}.dose-row strong{font-size:14px}}
</style></head><body><main><a href="./" class="button secondary">← Carte d’Astréon</a><p class="tag">Les ateliers secrets · Révision libre</p><h1>La Guilde des Artisans</h1><p>Répare, fabrique, explore. Quatre ateliers, douze missions, quatre sceaux.</p><div id="app"></div><footer class="muted">Progression locale et facultative. Ces missions ne modifient pas la note du devoir ni les indicateurs de maîtrise autonome.</footer></main><script src="workshops-engine.js?v=117"></script><script>
'use strict';
const E=globalThis.AstreonWorkshops,$=id=>document.getElementById(id),app=$('app'),key='astreon-workshops-v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groups=[{name:'Le laboratoire des fractions',mentor:'Fibonacci',desc:'Dose trois ingrédients pour fabriquer des potions.',missions:E.potions},{name:'Les bâtisseurs de Thalès',mentor:'Thalès',desc:'Ajuste les supports pour reconstruire les ponts.',missions:E.bridges},{name:'L’observatoire d’Hipparque',mentor:'Hipparque',desc:'Oriente le télescope pour retrouver les étoiles.',missions:E.stars},{name:'L’usine d’Ada',mentor:'Ada Lovelace',desc:'Programme un automate et franchis les labyrinthes.',missions:E.mazes}];
let done=[];try{let p=JSON.parse(localStorage.getItem(key));if(Array.isArray(p?.done))done=[...new Set(p.done.filter(s=>/^[0-3]:[0-2]$/.test(s)))]}catch{}
let group=0,level=0,amounts=[],setting=0,commands=[],step=-1,runTimer=0,won=false,running=false,storageOK=true;
const colors=['#76b8db','#e4b759','#bd89d6'],labels={F:'Avancer',L:'Tourner à gauche',R:'Tourner à droite'},symbols={F:'↑',L:'↶',R:'↷'};
function stopRun(){clearInterval(runTimer);runTimer=0;running=false}
function save(){try{localStorage.setItem(key,JSON.stringify({done}));storageOK=true}catch{storageOK=false}}
function mark(){won=true;let id=group+':'+level;if(!done.includes(id)){done.push(id);save()}let f=$('feedback');f.className='status good';f.textContent='Mission accomplie ! '+(groups[group].missions.every((_,j)=>done.includes(group+':'+j))?'Sceau de l’atelier acquis.':'La prochaine salle t’attend.')+(!storageOK?' Attention : sauvegarde indisponible.':'');$('next').disabled=false}
function message(s,bad=false){let f=$('feedback');f.className='status'+(bad?' bad':'');f.textContent=s}
function svg(inner){return '<svg viewBox="0 0 400 260" role="img" aria-label="Atelier '+esc(groups[group].name)+'">'+inner+'</svg>'}
function potionArt(m,a){
 let inner='<defs><linearGradient id="stone" x2="0" y2="1"><stop stop-color="#324b61"/><stop offset="1" stop-color="#172b3b"/></linearGradient></defs><rect width="400" height="260" fill="url(#stone)"/><path d="M0 225H400" stroke="#ad8b59" stroke-width="8"/><path d="M15 225V30Q15 9 40 9H360Q385 9 385 30V225" fill="none" stroke="#8296a3" stroke-width="4"/>';
 for(let i=0;i<3;i++){let x=40+i*112,h=Math.min(110,110*a[i]/m.total);inner+='<rect x="'+x+'" y="35" width="70" height="18" rx="4" fill="#c6a575"/><path d="M'+(x+10)+' 53V75L'+x+' 100V198Q'+x+' 212 '+(x+14)+' 212H'+(x+56)+'Q'+(x+70)+' 212 '+(x+70)+' 198V100L'+(x+60)+' 75V53" fill="#d0edfa16" stroke="#bed5e0" stroke-width="2"/><rect x="'+(x+3)+'" y="'+(209-h)+'" width="64" height="'+h+'" rx="3" fill="'+colors[i]+'" opacity=".9"/>'+Array.from({length:6},(_,j)=>'<path d="M'+(x+55)+' '+(99+j*20)+'h12" stroke="#e6f4f8" opacity=".8"/>').join('')+'<text x="'+(x+35)+'" y="235" text-anchor="middle" fill="#f3e3c9" font-size="12">'+esc(m.colors[i])+'</text><text x="'+(x+35)+'" y="254" text-anchor="middle" fill="#f3e3c9" font-size="13">'+a[i]+' doses</text>'}
 return svg(inner)
}
function bridgeArt(m,v){
 const ratio=m.small/m.large,x=42+316*ratio,base=205,top=base-145,expected=E.bridgeGoal(m),lineY=base-145,sy=base-145*ratio,actual=base-145*v/expected;
 return svg('<rect width="400" height="260" fill="#243d52"/><path d="M0 205L48 205 66 242 335 242 353 205H400V260H0Z" fill="#38636b"/><path d="M0 230Q75 215 150 232T300 232T400 230" fill="none" stroke="#8ac4cc" stroke-width="3"/><path d="M42 205L358 '+lineY+'" fill="none" stroke="#c3a06b" stroke-width="7" stroke-linecap="round"/><path d="M42 205H358" stroke="#b6c8d6" stroke-dasharray="5 6"/><path d="M'+x+' 205V'+sy+'" stroke="#bcd0df" stroke-width="9"/><path d="M358 205V'+Math.max(12,actual)+'" stroke="'+(v===expected?'#9bd9ab':'#b98666')+'" stroke-width="12"/><path d="M'+(x-10)+' 195H'+x+'V205M348 195H358V205" fill="none" stroke="#f3e8d7"/><path d="M42 220H'+x+'M42 244H358" stroke="#d7e4ea" stroke-width="1"/><text x="'+((42+x)/2)+'" y="217" text-anchor="middle" fill="#fff" font-size="12">'+m.small+' m</text><text x="200" y="240" text-anchor="middle" fill="#fff" font-size="12">'+m.large+' m</text><text x="'+(x-8)+'" y="'+(sy-8)+'" text-anchor="end" fill="#f0d09a" font-size="13">'+m.height+' m</text><text x="344" y="'+Math.max(24,actual-8)+'" text-anchor="end" fill="#f0d09a" font-size="13">'+v+' m</text><text x="12" y="20" fill="#d5e0e7" font-size="11">Schéma non à l’échelle</text>')
}
function starArt(m,a){
 let scale=Math.min(240/m.distance,160/m.height),x=45,y=220,tx=x+m.distance*scale,ty=y-m.height*scale,rad=a*Math.PI/180,ex=x+Math.cos(rad)*390,ey=y-Math.sin(rad)*390;
 let sky=Array.from({length:29},(_,i)=>'<circle cx="'+((i*73+11)%400)+'" cy="'+((i*47+17)%210)+'" r="'+(i%4===0?1.8:1)+'" fill="#dbe8f5" opacity=".6"/>').join('');
 return svg('<rect width="400" height="260" fill="#14253e"/>'+sky+'<path d="M0 228Q80 210 145 228T300 223T400 225V260H0Z" fill="#30495d"/><path d="M'+x+' '+y+'H'+tx+'V'+ty+'" stroke="#95a9c2" stroke-dasharray="5 4" fill="none"/><path d="M'+(tx-12)+' '+y+'v-12h12" stroke="#b7c8dc" fill="none"/><path d="M'+x+' '+y+'L'+ex+' '+ey+'" stroke="#f1c96e" stroke-width="2" opacity=".9"/><g transform="translate('+tx+' '+ty+')"><path d="M0 -12L3 -3 12 0 3 3 0 12 -3 3 -12 0 -3 -3Z" fill="#ffe5a0"/><circle r="17" fill="none" stroke="#f7d995" opacity=".5"/></g><g transform="translate('+x+' '+y+') rotate('+(-a)+')"><rect x="-7" y="-8" width="60" height="16" rx="4" fill="#829aaf" stroke="#dce6e9"/><rect x="44" y="-11" width="12" height="22" rx="4" fill="#c5a16b"/></g><path d="M45 220L22 248M45 220L65 248" stroke="#c5a16b" stroke-width="5"/><text x="'+((x+tx)/2)+'" y="242" fill="#f3e5cd" text-anchor="middle" font-size="13">'+m.distance+' m</text><text x="'+(tx-8)+'" y="'+((y+ty)/2)+'" fill="#f3e5cd" text-anchor="end" font-size="13">'+m.height+' m</text><text x="12" y="18" font-size="11" fill="#d5e0e7">Schéma de visée</text>')
}
function mazeArt(m,state){let rows=m.grid.length,cols=m.grid[0].length,s=Math.min(47,220/rows,365/cols),ox=(400-cols*s)/2,oy=(260-rows*s)/2;let inner='<rect width="400" height="260" fill="#172b3b"/>';m.grid.forEach((row,y)=>[...row].forEach((c,x)=>{let a=ox+x*s,b=oy+y*s;inner+='<rect x="'+a+'" y="'+b+'" width="'+s+'" height="'+s+'" rx="3" fill="'+(c==='#'?'#4c687b':c==='G'?'#37674c':'#24394b')+'" stroke="#748fa0" stroke-width=".8"/>';if(c==='G')inner+='<text x="'+(a+s/2)+'" y="'+(b+s*.67)+'" text-anchor="middle" fill="#f1d49a" font-size="'+(s*.6)+'">✦</text>'}));if(state.path.length>1)inner+='<polyline points="'+state.path.map(([x,y])=>(ox+(x+.5)*s)+','+(oy+(y+.5)*s)).join(' ')+'" fill="none" stroke="#d8bb7e" stroke-width="3" stroke-linecap="round" opacity=".7"/>';inner+='<g transform="translate('+(ox+(state.x+.5)*s)+' '+(oy+(state.y+.5)*s)+') rotate('+(state.d*90)+')"><rect x="'+(-s*.29)+'" y="'+(-s*.29)+'" width="'+s*.58+'" height="'+s*.58+'" rx="5" fill="#7fa7c5" stroke="#d9e8ef"/><circle cx="'+(-s*.1)+'" cy="'+(-s*.08)+'" r="2" fill="#f8d78e"/><circle cx="'+s*.1+'" cy="'+(-s*.08)+'" r="2" fill="#f8d78e"/><path d="M'+(-s*.15)+' '+(-s*.31)+'L0 '+(-s*.48)+' '+s*.15+' '+(-s*.31)+'Z" fill="#f5d08a"/></g>';return svg(inner)}
function home(){stopRun();app.innerHTML='<section class="panel"><h2>Le registre de la guilde</h2><p>'+done.length+'/12 missions accomplies · '+groups.filter((g,i)=>g.missions.every((_,j)=>done.includes(i+':'+j))).length+'/4 sceaux</p><div class="progress"><i style="width:'+done.length/12*100+'%"></i></div><div class="map">'+groups.map((g,i)=>'<article class="tile">'+[potionArt(E.potions[0],[2,4,6]),bridgeArt(E.bridges[0],9),starArt(E.stars[0],37),mazeArt(E.mazes[0],E.simulate(E.mazes[0],[]))][i]+'<h3>'+esc(g.name)+'</h3><p>'+esc(g.desc)+'</p><p class="muted">'+g.missions.filter((_,j)=>done.includes(i+':'+j)).length+'/3 missions · '+esc(g.mentor)+'</p><button data-workshop="'+i+'">Entrer dans l’atelier</button></article>').join('')+'</div></section>';app.querySelectorAll('[data-workshop]').forEach(b=>b.onclick=()=>{let i=+b.dataset.workshop;open(i,groups[i].missions.findIndex((_,j)=>!done.includes(i+':'+j))<0?0:groups[i].missions.findIndex((_,j)=>!done.includes(i+':'+j)))})}
function open(g,l){stopRun();group=g;level=l;amounts=[0,0,0];setting=0;commands=[];step=-1;won=false;view()}
function view(){let g=groups[group],m=g.missions[level];app.innerHTML='<section class="panel"><p class="tag">'+esc(g.mentor)+' · Mission '+(level+1)+'/3</p><h2>'+esc(m.name)+'</h2><div class="mini-nav">'+g.missions.map((_,j)=>'<button class="secondary '+(done.includes(group+':'+j)?'done ':'')+(j===level?'current':'')+'" data-level="'+j+'">'+(j+1)+'</button>').join('')+'</div><div class="board"><div id="scene" class="scene"></div><div class="controls" id="controls"></div></div><p id="feedback" class="status" role="status">À toi de jouer.</p><div class="buttons"><button id="hint" class="secondary">Conseil du mentor</button><button id="next" disabled>'+(level===2?'Retour à la guilde':'Mission suivante')+'</button><button id="reset" class="secondary">Recommencer</button><button id="home" class="secondary">Carte des ateliers</button></div></section>';
 app.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>open(group,+b.dataset.level));$('home').onclick=home;$('reset').onclick=()=>open(group,level);$('next').onclick=()=>level===2?home():open(group,level+1);
 if(group===0)potion(m);else if(group===1)bridge(m);else if(group===2)stars(m);else maze(m)
}
function potion(m){
 $('controls').innerHTML='<p>Remplis les trois flacons pour obtenir <strong>'+m.total+' doses</strong> au total, selon la recette.</p>'+m.parts.map((p,i)=>'<div class="dose-row"><div><strong style="color:'+colors[i]+'">'+esc(m.colors[i])+'</strong><small>'+p+'/'+m.den+' de la potion</small></div><button class="secondary" data-dose="'+i+'" data-delta="-1" aria-label="Retirer une dose de '+esc(m.colors[i])+'">−</button><span class="dose-value" id="dose'+i+'">0</span><button data-dose="'+i+'" data-delta="1" aria-label="Ajouter une dose de '+esc(m.colors[i])+'">+</button></div>').join('')+'<p><strong id="totalDose">0</strong> / '+m.total+' doses versées</p><button id="check">Mélanger la potion</button>';
 function refresh(){let total=amounts.reduce((a,b)=>a+b,0);$('scene').innerHTML=potionArt(m,amounts);amounts.forEach((n,i)=>$('dose'+i).textContent=n);$('totalDose').textContent=total;app.querySelectorAll('[data-dose]').forEach(b=>b.disabled=won||(+b.dataset.delta<0?amounts[+b.dataset.dose]<=0:total>=m.total));$('check').disabled=won}
 app.querySelectorAll('[data-dose]').forEach(b=>b.onclick=()=>{amounts[+b.dataset.dose]+=+b.dataset.delta;refresh();message('Ajuste le mélange.')});$('check').onclick=()=>{if(E.potionOK(m,amounts)){mark();refresh()}else message(amounts.reduce((a,b)=>a+b,0)!==m.total?'Le volume total n’est pas correct.':'Le volume total est bon, mais les proportions ne correspondent pas à la recette.',true)};$('hint').onclick=()=>message('Pour chaque ingrédient, divise '+m.total+' par '+m.den+', puis multiplie par son numérateur.');refresh()
}
function adjust(m,max,unit,refresh,verify,hint,task){
 $('controls').innerHTML='<p>'+task+'</p><label for="setting">Réglage</label><p class="readout"><span id="value">0</span> '+unit+'</p><input id="setting" class="range" type="range" min="0" max="'+max+'" step="1" value="0"><div class="buttons"><button id="minus" class="secondary" aria-label="Diminuer">−</button><button id="plus" class="secondary" aria-label="Augmenter">+</button><button id="check">Valider le réglage</button></div>';
 function update(n){setting=Math.max(0,Math.min(max,n));$('setting').value=setting;$('value').textContent=setting;refresh(setting);$('minus').disabled=won||setting===0;$('plus').disabled=won||setting===max;$('setting').disabled=won;$('check').disabled=won}
 $('setting').oninput=e=>update(+e.target.value);$('minus').onclick=()=>update(setting-1);$('plus').onclick=()=>update(setting+1);$('check').onclick=()=>{if(verify(setting)){mark();update(setting)}else message('Le réglage ne convient pas encore. Observe la figure et recommence.',true)};$('hint').onclick=()=>message(hint);update(0)
}
function bridge(m){adjust(m,Math.ceil(E.bridgeGoal(m)*1.3),'m',n=>$('scene').innerHTML=bridgeArt(m,n),n=>n===E.bridgeGoal(m),'Les supports sont verticaux, donc parallèles. Utilise le rapport hauteur / distance depuis l’origine : '+m.height+'/'+m.small+'.','Les deux supports sont perpendiculaires au sol horizontal. Ajuste le grand support pour qu’il touche exactement le tablier incliné. Petit support : '+m.height+' m à '+m.small+' m de l’origine. Grand support à '+m.large+' m.')}
function stars(m){adjust(m,90,'°',n=>$('scene').innerHTML=starArt(m,n),n=>n===E.starGoal(m),'Utilise la tangente : tan(angle) = hauteur / distance horizontale. Arrondis au degré près.','Oriente le télescope vers l’étoile. Elle se trouve à '+m.height+' m au-dessus de l’horizontale du télescope et à '+m.distance+' m horizontalement. Arrondis l’angle au degré près.')}
function maze(m){
 $('controls').innerHTML='<p>Assemble les blocs pour atteindre la rune dorée sans heurter les murs. L’automate avance d’une case par bloc.</p><div class="palette">'+['F','L','R'].map(op=>'<button data-op="'+op+'">'+symbols[op]+' '+labels[op]+'</button>').join('')+'</div><p class="muted">Programme (30 blocs maximum). Touche un bloc pour le supprimer.</p><div class="program" id="program"></div><div class="buttons"><button id="run">⚑ Exécuter</button><button id="clear" class="secondary">Effacer les blocs</button><button id="stop" class="secondary" disabled>Arrêter</button></div>';
 function draw(s){$('scene').innerHTML=mazeArt(m,s)}
 function refresh(){let p=$('program');p.innerHTML=commands.length?commands.map((op,i)=>'<button data-remove="'+i+'" class="'+(step===i?'current':'')+'" aria-label="Supprimer bloc '+(i+1)+' : '+labels[op]+'" '+(running||won?'disabled':'')+'>'+(i+1)+' '+symbols[op]+'</button>').join(''):'<span class="empty">Ajoute ton premier bloc.</span>';p.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{commands.splice(+b.dataset.remove,1);step=-1;refresh();draw(E.simulate(m,[]))});app.querySelectorAll('[data-op]').forEach(b=>b.disabled=running||won||commands.length>=30);$('run').disabled=running||won||!commands.length;$('clear').disabled=running||won||!commands.length;$('stop').disabled=!running}
 app.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{commands.push(b.dataset.op);step=-1;refresh();draw(E.simulate(m,[]))});
 $('clear').onclick=()=>{commands=[];step=-1;refresh();draw(E.simulate(m,[]))};
 $('stop').onclick=()=>{stopRun();step=-1;refresh();message('Exécution arrêtée.')};
 $('run').onclick=()=>{if(running||won)return;running=true;step=-1;refresh();draw(E.simulate(m,[]));message('Exécution en cours…');let i=0;runTimer=setInterval(()=>{let s=E.simulate(m,commands.slice(0,++i));step=i-1;draw(s);refresh();if(s.hit||i>=commands.length){stopRun();if(s.won)mark();else message(s.hit?'L’automate a heurté un mur. Corrige tes blocs.':'Le programme se termine avant la rune. Ajoute ou modifie les blocs.',true);refresh()}},matchMedia('(prefers-reduced-motion: reduce)').matches?40:280)};
 $('hint').onclick=()=>message('Repère l’orientation de la flèche. Tourner ne change pas la case ; avancer déplace d’une case. Décompose le chemin en segments droits.');
 draw(E.simulate(m,[]));refresh()
}
window.addEventListener('pagehide',stopRun);home();
</script></body></html>
