<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astréon — Les salles secrètes</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8eddf;color:#263e36;font:16px/1.5 system-ui,sans-serif}main{max-width:950px;margin:auto;padding:12px}h1,h2,h3{font-family:Georgia,serif;line-height:1.15;margin:7px 0}h1{font-size:clamp(25px,6vw,36px)}p{margin:7px 0}.muted{color:#596d60;font-size:13px}.top,.buttons{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.top{justify-content:space-between}button,a.button{font:inherit;font-weight:650;min-height:44px;padding:8px 12px;border:1px solid #6b8a73;border-radius:8px;background:#365c49;color:white;cursor:pointer;text-decoration:none}button.secondary,a.secondary{background:#fffaf0;color:#294536;border-color:#aab699}button:disabled{opacity:.5;cursor:default}button:focus-visible,canvas:focus-visible{outline:3px solid #b98e42;outline-offset:2px}.panel{background:#fffaf0;border:1px solid #b4c09f;border-radius:12px;padding:12px;margin:10px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:10px}.tile{border:1px solid #b4c09f;border-radius:9px;padding:10px;background:#f4f4e8}.tile canvas{width:100%;height:auto;display:block;border-radius:6px}.tile button{width:100%;margin-top:8px}.tag{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#6b7957;font-weight:700}.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:10px;align-items:start}.scene{border:2px solid #859c87;border-radius:10px;overflow:hidden;background:#d3d9c8}.scene canvas{width:100%;height:auto;display:block;touch-action:manipulation}.inventory{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.inventory span{border:1px solid #abbba4;background:#e6eadb;border-radius:6px;font-size:13px;padding:5px 8px}.inventory .earned{background:#d7e8d0;color:#315b38}.control{display:flex;gap:8px;align-items:center;margin-top:8px}.pad{display:grid;grid-template-columns:repeat(3,44px);gap:3px;touch-action:none}.pad button{padding:0;touch-action:none;font-size:19px}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.actions{display:grid;gap:5px;flex:1}.status{background:#e8eddf;padding:8px;border-radius:6px;min-height:44px;font-size:14px}.clue{background:#f3e8cd;border-left:3px solid #af8d56;padding:9px;border-radius:5px}.legend{font-size:13px;color:#596d60}.warn{color:#91462c;font-size:13px}.victory{border:1px solid #90b48b;border-radius:8px;background:#dcebd4;padding:10px}.sequence{display:flex;flex-wrap:wrap;gap:5px}.sequence span{background:#eee3c7;border-radius:5px;padding:5px 9px;font-weight:700}footer{margin-top:10px}@media(max-width:680px){main{padding:7px}.panel{padding:8px}.layout{grid-template-columns:1fr}.actions button{font-size:13px}.top a{font-size:13px}.scene canvas{max-height:49dvh;object-fit:contain}}
</style></head><body><main><div class="top"><div><div class="tag">Astréon · Expéditions secrètes</div><h1>Les passages cachés</h1></div><a href="donjons.html" class="button secondary">← Les donjons</a></div><div id="app"></div><p id="warn" class="warn" role="status"></p><footer class="muted">Trois salles bonus. Sans chronomètre ni note. Les clés et les récompenses restent sur cet appareil.</footer></main><script src="secrets-engine.js?v=124"></script><script src="hero-art-120.js?v=120"></script><script src="voice-fr.js?v=114"></script><script>
'use strict';
const E=AstreonSecrets,$=id=>document.getElementById(id),app=$('app'),key='astreon-secrets-v1',T=E.T;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function read(k){try{return JSON.parse(localStorage.getItem(k))||{}}catch{return {}}}
let raw=read(key),book={},old=read('gardiens-dnb-v1'),r=null,s=null,route=[],timer=0,face=1,msg='',reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
for(let q of E.rooms)if(raw[q.id])book[q.id]=E.clean(q,raw[q.id]);
function eligible(q){return E.eligible(q,read('astreon-dungeons-v1').areas)}
function save(){try{localStorage.setItem(key,JSON.stringify(book));$('warn').textContent=''}catch{$('warn').textContent='Sauvegarde locale indisponible.'}}
function stop(){clearInterval(timer);timer=0;route=[];globalThis.AstreonVoice?.stop()}
function draw(c,q,a,hero=true){
 let W=E.W*T,H=E.H*T,[light,stone,accent]=q.theme;
 const rect=(x,y,w,h,f)=>{c.fillStyle=f;c.fillRect(x,y,w,h)},ell=(x,y,rx,ry,f)=>{c.beginPath();c.ellipse(x,y,rx,ry,0,Math.PI*2);c.fillStyle=f;c.fill()},line=(x,y,X,Y,f,w=1)=>{c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.strokeStyle=f;c.lineWidth=w;c.lineCap='round';c.stroke()},label=(t,x,y,size=14,color='#233f38')=>{c.fillStyle=color;c.font='bold '+size+'px system-ui';c.textAlign='center';c.textBaseline='middle';c.fillText(t,x,y)};
 let g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,light);g.addColorStop(1,stone);rect(0,0,W,H,g);
 for(let y=0;y<E.H;y++)for(let x=0;x<E.W;x++){let X=x*T,Y=y*T,wall=q.map[y][x]==='#';rect(X+1,Y+1,T-2,T-2,wall?accent:(x+y)%2?'#ffffff26':'#ffffff47');line(X+2,Y+T-3,X+T-3,Y+T-3,'#415a5344',2);
  if(wall){rect(X+4,Y+4,T-8,16,'#ffffff27');line(X+6,Y+24,X+T-6,Y+24,'#1d3c3b55');line(X+T/2,Y+5,X+T/2,Y+24,'#1d3c3b44')}
  else if(q.id==='cave'&&x%3===0&&y<3){ell(X+24,Y+26,15,8,'#75c6cf');line(X+13,Y+24,X+33,Y+24,'#e1fff6',1.5)}
  else if(q.id==='vault'&&(x+y)%4===0){ell(X+24,Y+24,6,9,'#b4a1db');line(X+24,Y+16,X+24,Y+32,'#eee8ff')}
 }
 let [gx,gy]=q.gate.map(n=>n*T+T/2);rect(gx-22,gy-22,44,44,'#4e625a');rect(gx-17,gy-19,34,38,a.open?'#cde8bc':'#977853');if(!a.open)for(let i=-1;i<=1;i++)line(gx+i*10,gy-18,gx+i*10,gy+18,'#5e503c',3);else label('✓',gx,gy,20,'#386246');
 (q.plates||[]).forEach(([x,y],i)=>{let X=x*T+24,Y=y*T+24;rect(X-20,Y-20,40,40,'#6e9391');rect(X-16,Y-16,32,32,E.same(a.box,[x,y])?'#d9b678':'#d7e2bb');label(q.labels[i]+' L',X,Y,12)});
 (q.switches||[]).forEach(([x,y],i)=>{let X=x*T+24,Y=y*T+24,on=q.kind==='sequence'?a.sequence.includes(i):!!a.lights[i];ell(X,Y+9,20,10,'#45655740');rect(X-19,Y-18,38,34,'#7c8e7b');ell(X,Y-2,13,13,on?'#f7d67b':'#b0a9a0');if(on)ell(X,Y-2,7,7,'#fff5b4');label(q.labels[i],X,Y+20,10,'#203c31')});
 if(a.box){let [x,y]=a.box.map(n=>n*T+24);rect(x-17,y-17,34,34,'#aa7849');rect(x-13,y-13,26,26,'#d4a36a');line(x-15,y-15,x+15,y+15,'#895f3d',3);line(x+15,y-15,x-15,y+15,'#895f3d',3);rect(x-17,y-17,34,3,'#7d6045')}
 if(a.open&&!a.key){let [x,y]=q.key.map(n=>n*T+24);ell(x-7,y,8,8,'#e6bf60');ell(x-7,y,3,3,light);line(x,y,x+16,y,'#b38b38',4);line(x+10,y,x+10,y+6,'#b38b38',3);line(x+15,y,x+15,y+6,'#b38b38',3)}
 let [x,y]=q.chest.map(n=>n*T+24);rect(x-17,y-12,34,26,a.found?'#d4bd86':'#966f48');rect(x-18,y-13,36,7,'#bd9863');rect(x-3,y-4,6,9,'#e8c76c');label(a.found?'✓':'✦',x,y-24,16,'#906d35');
 if(hero){AstreonHero120.hero(c,{...(old.castleStyle||{}),character:old.hero||'knight',x:a.pos[0]*T+24,y:a.pos[1]*T+38,scale:.59,time:0,face,pose:'idle'})}
}
function home(){stop();r=null;s=null;app.innerHTML='<section class="panel"><h2>Les trois passages</h2><p>Une relique de donjon révèle une salle secrète supplémentaire. Ici, ce sont les objets et le décor qui répondent à tes actions.</p><div class="cards">'+E.rooms.map(q=>'<article class="tile"><canvas width="528" height="432" data-preview="'+q.id+'" aria-hidden="true"></canvas><h3>'+esc(q.name)+'</h3><p class="muted">'+(eligible(q)?book[q.id]?.found?'Trésor découvert':'Passage révélé':'Termine d’abord le donjon correspondant.')+'</p><button data-room="'+q.id+'" '+(eligible(q)?'':'disabled')+'>'+(book[q.id]?.found?'Revisiter':'Explorer')+'</button></article>').join('')+'</div><p>'+E.rooms.filter(q=>book[q.id]?.found).length+'/3 trésors secrets découverts.</p></section>';
 app.querySelectorAll('[data-preview]').forEach(c=>{let q=E.room(c.dataset.preview);draw(c.getContext('2d'),q,book[q.id]||E.fresh(q),false)});app.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>open(b.dataset.room))}
function open(id){let q=E.room(id);if(!q||!eligible(q))return;stop();r=q;s=book[id]||(book[id]=E.fresh(q));msg='Observe le décor et lis l’inscription.';save();view()}
function view(){app.innerHTML='<section class="panel"><div class="top"><h2>'+esc(r.name)+'</h2><button class="secondary" id="leave">Quitter la salle</button></div><div class="layout"><div><div class="scene"><canvas id="map" width="528" height="432" tabindex="0" aria-label="Salle secrète. Flèches pour marcher. Pour pousser une caisse, avance vers elle."></canvas></div><div class="control"><div class="pad"><button class="secondary up" data-dir="0,-1" aria-label="Haut">↑</button><button class="secondary left" data-dir="-1,0" aria-label="Gauche">←</button><button class="secondary down" data-dir="0,1" aria-label="Bas">↓</button><button class="secondary right" data-dir="1,0" aria-label="Droite">→</button></div><div class="actions"><button id="action">Interagir</button><button id="reset" class="secondary">Replacer les objets</button></div></div><p class="muted">Flèches, ZQSD ou boutons directionnels. Touche une case pour marcher ; pour pousser, avance vers la caisse. Entrée pour agir.</p></div><div><h3>Inscription ancienne</h3><p class="clue">'+esc(r.clue)+'</p><div class="buttons"><button class="secondary" id="hint">Indice</button><button class="secondary" id="listen">Écouter</button></div><p id="voice" class="muted"></p><h3>Inventaire</h3><div id="inventory" class="inventory"></div><div id="mechanism"></div><p id="status" class="status" role="status"></p><div id="victory"></div></div></div></section>';
 $('leave').onclick=home;$('reset').onclick=()=>{stop();let found=s.found;s=book[r.id]=E.fresh(r);if(found){s.open=s.key=s.found=true}msg='Objets replacés. Le trésor déjà découvert reste acquis.';save();refresh()};$('hint').onclick=()=>{msg=r.hint;refresh()};$('listen').onclick=()=>globalThis.AstreonVoice?.speak(r.clue,$('voice'));$('action').onclick=action;
 app.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{stopRoute();let [x,y]=b.dataset.dir.split(',').map(Number);step(x,y)});
 $('map').onpointerup=e=>{let c=$('map'),b=c.getBoundingClientRect(),scale=Math.min(b.width/c.width,b.height/c.height);let p=[Math.floor((e.clientX-b.left-(b.width-c.width*scale)/2)/scale/T),Math.floor((e.clientY-b.top-(b.height-c.height*scale)/2)/scale/T)];stopRoute();if(E.near(s.pos,p)&&!E.same(s.pos,p)){step(p[0]-s.pos[0],p[1]-s.pos[1]);return}go(p)};refresh()}
function stopRoute(){clearInterval(timer);timer=0;route=[]}
function refresh(){if(!r)return;draw($('map').getContext('2d'),r,s);$('status').textContent=msg;$('inventory').innerHTML='<span class="'+(s.open?'earned':'')+'">'+(s.open?'✓ Passage ouvert':'◇ Passage fermé')+'</span><span class="'+(s.key?'earned':'')+'">'+(s.key?'✓ Clé acquise':'◇ Clé à trouver')+'</span><span class="'+(s.found?'earned':'')+'">'+(s.found?'✓ Trésor acquis':'◇ Coffre fermé')+'</span>';
 let i=(r.switches||[]).findIndex(p=>E.same(p,s.pos)),chest=E.near(s.pos,r.chest);$('action').disabled=!(i>=0||chest);$('action').textContent=chest?'Ouvrir le coffre':i>=0?(r.kind==='sequence'?'Faire sonner la cloche':'Actionner le levier'):'Interagir';
 $('mechanism').innerHTML=r.kind==='sequence'?'<p class="legend">Cloche(s) dans le bon ordre : '+s.sequence.length+'/3</p><div class="sequence">'+s.sequence.map(i=>'<span>'+esc(r.labels[i])+'</span>').join('')+'</div>':r.kind==='lights'?'<p class="legend">'+s.lights.map((n,i)=>r.labels[i]+': '+(n?'allumée':'éteinte')).join(' · ')+'</p>':'<p class="legend">Pousse la caisse, sans la coincer contre un mur. Tu peux replacer les objets à tout moment.</p>';
 $('victory').innerHTML=s.found?'<div class="victory"><strong>✦ Trésor secret découvert !</strong><p>Tu peux explorer encore ou retourner aux donjons.</p></div>':'';
}
function step(dx,dy){if(!r)return;let was=s.open,result=E.move(r,s,dx,dy);if(dx)face=dx>0?1:-1;msg=result==='blocked'?'Le passage est bloqué.':result==='key'?'Tu as trouvé la clé ! Rejoins le coffre.':!was&&s.open?'Le mécanisme s’active : le passage est ouvert !':s.open?'Explore la zone derrière la porte.':'Observe les mécanismes et déplace-toi.';if(result!=='blocked')save();refresh();return result}
function go(p){let a=E.path(r,s,p);if(!a){msg='Ce chemin est fermé ou un objet le bloque.';refresh();return}route=a;timer=setInterval(()=>{let n=route.shift();if(!n){stopRoute();return}if(step(n[0]-s.pos[0],n[1]-s.pos[1])==='blocked'||!route.length)stopRoute()},reduced?30:110)}
function action(){if(!r)return;stopRoute();let result=E.interact(r,s);msg=({wrong:'La cloche ne convient pas à cet ordre. La séquence recommence.',switch:'Le mécanisme a changé.',open:'Le passage est ouvert ! Va chercher la clé.',locked:'Il te manque la clé.',reward:'Le coffre s’ouvre ! Un trésor secret rejoint ta collection.',found:'Ce trésor est déjà acquis.',none:'Approche-toi d’un mécanisme.'})[result]||'';save();refresh()}
const dirs={ArrowUp:[0,-1],z:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],q:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
document.addEventListener('keydown',e=>{if(!r)return;let dir=dirs[e.key]||dirs[e.key.toLowerCase()];if(dir){e.preventDefault();stopRoute();step(...dir)}else if(e.key==='Enter'&&!/BUTTON|A/.test(e.target.tagName)){e.preventDefault();action()}});
window.addEventListener('pagehide',()=>{stop();if(r)save()});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
let zone=new URLSearchParams(location.search).get('zone');if(zone&&E.room(zone)&&eligible(E.room(zone)))open(zone);else home();
</script></body></html>
