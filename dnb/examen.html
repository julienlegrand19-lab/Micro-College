<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astréon — Brevet blanc</title><style>
:root{color-scheme:light;--ink:#172b3b;--muted:#546778;--line:#cddae3;--accent:#245b79}*{box-sizing:border-box}body{margin:0;background:#f1f5f8;color:var(--ink);font:16px/1.55 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:16px}a{color:var(--accent)}h1{font-size:clamp(25px,6vw,36px);line-height:1.15}h2{font-size:22px}h3{font-size:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}.muted{color:var(--muted);font-size:13px}.buttons,.nav{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}button,select,input{font:inherit;border:1px solid #7994a6;border-radius:8px;padding:10px;min-height:44px}button{background:var(--accent);color:white;cursor:pointer;font-weight:650}button.secondary{color:var(--ink);background:#fff}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #3c8cad;outline-offset:2px}.nav button{min-width:42px;padding:7px}.nav .done{background:#e2eee7;color:#234c38}.nav .current{outline:2px solid #245b79;outline-offset:2px}.nav .locked{background:#e8edf1;color:#667785}.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}label{display:block;font-weight:600;margin:12px 0 4px}input.answer,select.answer{width:100%;font-size:16px;background:white;color:var(--ink)}.question{font-size:18px;white-space:pre-line}.math-note{background:#f1f6fa;padding:10px;border-radius:8px}.score{font-size:32px;font-weight:750;color:#245b79}.good{color:#226647}.bad{color:#a73530}.answer-card{border-top:1px solid var(--line);padding:10px 0}.answer-card p{white-space:pre-line}.paper{font-size:13px;color:var(--muted)}svg{max-width:100%;height:auto;display:block;margin:10px auto}svg path{fill:none;stroke:#172b3b;stroke-width:1.5}svg text{fill:#172b3b;font-size:13px}.block{display:table;padding:6px 10px;margin:3px 0;background:#386fc0;border-radius:7px;color:white;font-size:14px;font-weight:700}.event{background:#946400}.variable{background:#aa5700}.control{background:#946400}.branch{border-left:11px solid #946400;padding-left:9px;margin-left:10px}.look{background:#7655a9}.endblock{width:50px;height:7px;border-radius:0 0 6px 6px;background:#946400;margin-left:10px}.exam-scratch{background:#ecf0f4;padding:12px;border-radius:10px}.exam-scratch .block{max-width:100%}footer{margin:18px 0}progress{width:100%;accent-color:var(--accent)}@media(max-width:500px){main{padding:9px}.panel{padding:12px}.question{font-size:16px}.nav button{min-width:38px}}
</style></head><body><main><a href="./">← Retour à Astréon</a><h1>Brevet blanc d’entraînement</h1><p class="muted">Sujet original limité aux sept chapitres étudiés. Ce n’est pas un sujet officiel ni un examen complet du programme.</p><div id="app"></div><footer class="muted">Simulation locale, sans aide ni classement. La note indicative ne modifie pas le devoir de vacances.</footer></main><script src="teacher-bank.js?v=113"></script><script>
'use strict';
const $=id=>document.getElementById(id),app=$('app'),key='astreon-exam-114';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bank=globalThis.AstreonTeacherBank;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const dec=n=>Math.round(n*10)/10;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
function fr(n,d){let g=gcd(n,d);return d/g===1?String(n/g):n/g+'/'+d/g}
function number(t,labels,expected,solution,points,diagram=''){return {t,labels,expected,solution,points,diagram,kind:'num'}}
function automatic(t,expected,solution,kind='num'){return {...number(t,['Réponse'],[expected],solution,1),kind}}
function generate(){
 let a=rnd(2,7),b=rnd(3,8),k=rnd(2,5),h=10*k,angle=[30,35,40,45,50][rnd(0,4)],r=angle*Math.PI/180;
 let auto=[
 automatic('Simplifier '+(3*k)+'/'+(4*k)+' sous forme irréductible.','3/4','Diviser les deux termes par '+k+'.','frac'),
 automatic('Calculer 1/3 + 1/6. Donner une fraction irréductible.','1/2','2/6 + 1/6 = 3/6 = 1/2.','frac'),
 automatic('Calculer (−'+a+') × '+b+'.',-a*b,'Le produit de deux nombres de signes contraires est négatif.'),
 automatic('Développer (x + '+a+')². Quel est le coefficient de x ?',2*a,'(x + a)² = x² + 2ax + a².'),
 automatic('ABC est rectangle en A. AB = '+3*k+' cm et AC = '+4*k+' cm. Calculer BC.',5*k,'BC² = AB² + AC² ; BC = '+5*k+' cm.'),
 automatic('Dans un programme, on met n à 2 puis on répète '+k+' fois « ajouter 3 à n ». Donner n.',2+3*k,'n = 2 + '+k+' × 3.')
 ];
 let N=24*k,AD=a,AB=a*k,AE=b,BC=5*k,A=3*k,B=4*k,C=5*k;
 let problems=[
 {title:'Exercice 1 — Partages successifs',qs:[number('Un stock contient '+N+' objets. On donne 3/8 du stock, puis 1/3 de ce qui reste. Calculer les deux quantités données puis la quantité finale.',['Premier don','Second don','Quantité finale'],[N*3/8,N*5/24,N*5/12],'Premier don = 3/8 du stock ; second = 1/3 des 5/8 restants ; il reste 5/12 du stock.',2)]},
 {title:'Exercice 2 — Géométrie du pont',qs:[
 number('D ∈ [AB], E ∈ [AC]. (DE) et (BC) sont perpendiculaires à une même droite. AD = '+AD+' m, DB = '+(AB-AD)+' m, AE = '+AE+' m et BC = '+BC+' m. Justifier que (DE) et (BC) sont parallèles, puis calculer AC et DE.',['Propriété utilisée','AC (m)','DE (m)'],['Deux droites perpendiculaires à une même droite sont parallèles',AE*k,5],'Les deux droites sont parallèles. AB = '+AB+' ; AD/AB = AE/AC = DE/BC = 1/'+k+'.',2,bank.homeworkQuestion(2,0).diagram),
 number('Un triangle de côtés '+A+', '+B+' et '+C+' mètres est-il rectangle ? Justifier sur brouillon et calculer son aire.',['Carré du plus grand côté','Somme des carrés des autres côtés','Aire (m²)'],[C*C,A*A+B*B,A*B/2],'Les carrés sont égaux : réciproque de Pythagore. Aire = '+A+' × '+B+' / 2.',2)
 ]},
 {title:'Exercice 3 — Mesurer une tour',qs:[number('À '+h+' m du pied d’une tour verticale, un élève vise son sommet à '+angle+'° au-dessus de l’horizontale. Ses yeux sont à 1,6 m du sol. Calculer la hauteur au-dessus de ses yeux, puis la hauteur totale. Arrondir au dixième sans arrondir les calculs intermédiaires.',['Hauteur au-dessus des yeux (m)','Hauteur totale (m)'],[dec(h*Math.tan(r)),dec(h*Math.tan(r)+1.6)],'Utiliser la tangente : hauteur au-dessus des yeux = '+h+' × tan('+angle+'°). Ajouter 1,6 m.',2)]},
 {title:'Exercice 4 — Calcul littéral',qs:[
 number('Un rectangle a pour dimensions (x + '+a+') et (2x + '+b+') mètres. Développer son aire sous la forme Ax² + Bx + C.',['A','B','C'],[2,b+2*a,a*b],'Développer les quatre produits et regrouper les termes de même degré.',2),
 number('On retire d’un carré de côté (x + '+a+') cm un carré de côté (x − '+a+') cm, avec x > '+a+'. Donner l’expression réduite de l’aire restante sous la forme Kx, puis sa valeur pour x = '+(a+3)+'.',['K','Aire (cm²)'],[4*a,4*a*(a+3)],'Développer les deux carrés : (x+a)² − (x−a)² = 4ax.',2)
 ]},
 {title:'Exercice 5 — Programmation et Scratch',qs:[
 {...number('Le programme ci-dessous trace un polygone régulier. Donner l’angle de rotation pour que le tracé se ferme après six côtés, puis la distance totale parcourue.',['Angle (°)','Distance (pas)'],[60,6*5*k],'360° / 6 = 60°. Distance = six fois la longueur d’un côté.',1),scratch:[['event','quand ⚑ est cliqué'],['control','répéter 6 fois'],['branch','avancer de '+5*k+' pas','tourner ↻ de ? degrés']]},
 {...number('Quel nombre est affiché à la fin du programme ?', ['Nombre final'],[2+3*k>10?2+3*k+4:2+3*k-2],'Après la boucle, n = '+(2+3*k)+'. Tester n > 10 puis appliquer la branche correspondante.',1),scratch:[['event','quand ⚑ est cliqué'],['variable','mettre n à 2'],['control','répéter '+k+' fois'],['branch','ajouter 3 à n'],['control','si n > 10 alors'],['branch','ajouter 4 à n'],['control','sinon'],['branch','ajouter −2 à n'],['look','dire n']]}
 ]}
 ];
 let qs=auto.map((q,i)=>({...q,section:'Automatismes',sectionIndex:0,title:'Automatisme '+(i+1)}));problems.forEach((g,j)=>g.qs.forEach((q,i)=>qs.push({...q,section:g.title,sectionIndex:j+1,title:g.title+' · Question '+(i+1)})));
 // Free-text property is a choice only; written justification stays on paper.
 let th=qs.find(q=>q.labels[0]==='Propriété utilisée');th.kind='mixed';th.options=[['Deux droites perpendiculaires à une même droite sont parallèles','Deux droites qui se coupent sont parallèles','Deux segments de même longueur sont parallèles','Deux droites perpendiculaires sont parallèles'].sort(()=>Math.random()-.5),null,null];
 return qs
}
function norm(s){return String(s??'').trim().replace(/−/g,'-').replace(/,/g,'.').replace(/\s/g,'').toLowerCase()}
function fraction(Q,a){if(!Array.isArray(a))return 0;let hit=0;Q.expected.forEach((e,i)=>{let v=norm(a[i]);if(!v)return;if(Q.kind==='frac'){let m=v.match(/^([+-]?\d+)(?:\/([1-9]\d*))?$/);if(m&&Number.isSafeInteger(+m[1])&&Number.isSafeInteger(+(m[2]||1))&&gcd(+m[1],+(m[2]||1))===1&&fr(+m[1],+(m[2]||1))===String(e))hit++}else if(typeof e==='number'){if(/^[-+]?\d+(?:\.\d+)?$/.test(v)&&Math.abs(Number(v)-e)<1e-8)hit++}else if(v===norm(e))hit++});return hit/Q.expected.length}
let M=null,timer=0,storageFailed=false;
function persist(){try{localStorage.setItem(key,JSON.stringify(M));storageFailed=false;document.getElementById('storageAlert')?.remove();return true}catch{storageFailed=true;let p=$('storageAlert');if(!p){p=document.createElement('p');p.id='storageAlert';p.className='math-note bad';p.setAttribute('role','alert');app.before(p)}p.textContent='Sauvegarde impossible sur cet appareil. Ne quitte pas la page avant la fin de la simulation.';return false}}
function restore(){try{let m=JSON.parse(localStorage.getItem(key));if(m&&Array.isArray(m.qs)&&m.qs.length===14&&Array.isArray(m.answers)&&m.answers.length===14&&Number.isFinite(m.deadline))return m}catch{}return null}
function timeText(ms){let n=Math.max(0,Math.ceil(ms/1000));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function completed(q,a){return Array.isArray(a)&&a.length===q.labels.length&&a.every(v=>String(v).trim())}
function start(){clearInterval(timer);let qs=generate(),now=Date.now();M={qs,answers:qs.map(()=>null),at:0,started:now,autoDeadline:now+20*60000,deadline:now+120*60000,autoClosed:false,finished:false};persist();view();timer=setInterval(tick,250)}
function landing(){clearInterval(timer);M=storageFailed&&M?M:restore();app.innerHTML='<section class="panel"><h2>Conditions de simulation</h2><p><strong>120 minutes · 20 points</strong></p><p>Première partie : 6 automatismes (20 minutes maximum, sans calculatrice). Puis 5 exercices portant sur les chapitres étudiés (calculatrice autorisée).</p><p>Rédige les justifications et les calculs sur une feuille. Le logiciel évalue les réponses saisies, pas la qualité de la rédaction. Tu pourras consulter la correction à la fin.</p><p class="math-note">Le temps continue de s’écouler si tu quittes la page. Les réponses sont sauvegardées sur cet appareil.</p><div class="buttons">'+(M?'<button id="resume">'+(M.finished?'Revoir mon bilan':'Reprendre mon sujet')+'</button>':'')+'<button id="newExam" class="'+(M?'secondary':'')+'">Nouveau sujet</button></div></section>';$('newExam').onclick=()=>{if(!M||confirm('Remplacer la simulation enregistrée ?'))start()};if($('resume'))$('resume').onclick=()=>{if(M.finished)result();else{tick();if(!M.finished){view();timer=setInterval(tick,250)}}}}
function tick(){if(!M||M.finished)return;let now=Date.now();if(now>=M.deadline){finish();return}if(!M.autoClosed&&now>=M.autoDeadline){M.autoClosed=true;M.at=6;persist();view();return}let e=$('examTime');if(e)e.textContent=timeText(M.deadline-now);let a=$('autoTime');if(a)a.textContent=timeText(M.autoDeadline-now)}
function scratchHtml(Q){if(!Q.scratch)return '';return '<div class="exam-scratch">'+Q.scratch.map(b=>b[0]==='branch'?'<div class="branch">'+b.slice(1).map(s=>'<div class="block">'+esc(s)+'</div>').join('')+'</div><div class="endblock"></div>':'<div class="block '+b[0]+'">'+esc(b[1])+'</div>').join('')+'</div>'}
function view(){if(M.finished){result();return}let Q=M.qs[M.at],a=M.answers[M.at]||Q.labels.map(()=>''),first=!M.autoClosed;
 app.innerHTML='<section class="panel"><div class="top"><strong>'+ (first?'Partie 1 · Sans calculatrice':'Partie 2 · Calculatrice autorisée')+'</strong><span class="clock" id="examTime">'+timeText(M.deadline-Date.now())+'</span></div>'+(first?'<p>Temps restant pour les automatismes : <strong id="autoTime">'+timeText(M.autoDeadline-Date.now())+'</strong></p>':'')+'<progress max="'+M.qs.length+'" value="'+M.answers.filter((a,j)=>completed(M.qs[j],a)).length+'"></progress><p class="muted">'+(M.at+1)+'/'+M.qs.length+' · '+Q.points+' point(s)</p><div class="nav">'+M.qs.map((q,j)=>'<button data-nav="'+j+'" class="secondary '+(completed(q,M.answers[j])?'done ':'')+(M.at===j?'current ':'')+(first?j>=6?'locked':'':j<6?'locked':'')+'" '+((first&&j>=6||!first&&j<6)?'disabled':'')+'>'+(j+1)+'</button>').join('')+'</div><h2>'+esc(Q.title)+'</h2><p class="question">'+esc(Q.t)+'</p>'+Q.diagram+scratchHtml(Q)+Q.labels.map((l,i)=>'<label for="a'+i+'">'+esc(l)+'</label>'+(Q.options?.[i]?'<select class="answer" id="a'+i+'"><option value="">Choisir…</option>'+Q.options[i].map(o=>'<option value="'+esc(o)+'" '+(a[i]===o?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>':'<input class="answer" id="a'+i+'" autocomplete="off" inputmode="text" value="'+esc(a[i])+'">')).join('')+'<p class="paper">Conserve sur papier les étapes de ton raisonnement.</p><div class="buttons"><button id="prev" class="secondary" '+(M.at===(first?0:6)?'disabled':'')+'>Précédente</button>'+(first&&M.at===5?'<button id="closeAuto">Passer à la partie 2</button>':M.at===M.qs.length-1?'<button id="finish">Terminer le sujet</button>':'<button id="next">Suivante</button>')+(first&&M.at!==5?'<button id="closeAuto" class="secondary">Terminer les automatismes</button>':!first&&M.at!==M.qs.length-1?'<button id="finish" class="secondary">Terminer le sujet</button>':'')+'<button id="leave" class="secondary">Sauvegarder et quitter</button></div></section>';
 Q.labels.forEach((_,i)=>$('a'+i).oninput=()=>{if(Date.now()>=M.deadline||!M.autoClosed&&Date.now()>=M.autoDeadline){tick();return}let a=M.answers[M.at]||Q.labels.map(()=>'');a[i]=$('a'+i).value;M.answers[M.at]=a;persist()});app.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{M.at=Number(b.dataset.nav);persist();view()});$('prev').onclick=()=>{M.at--;persist();view()};if($('next'))$('next').onclick=()=>{M.at++;persist();view()};if($('closeAuto'))$('closeAuto').onclick=()=>{if(confirm('Clôturer définitivement les automatismes ?')){M.autoClosed=true;M.at=6;persist();view()}};if($('finish'))$('finish').onclick=()=>{if(confirm('Terminer la simulation et afficher le corrigé ?'))finish()};$('leave').onclick=landing
}
function finish(){if(!M||M.finished)return;M.finished=true;M.submitted=Date.now();persist();clearInterval(timer);result()}
function result(){clearInterval(timer);let points=M.qs.map((Q,i)=>Q.points*fraction(Q,M.answers[i])),score=points.reduce((a,b)=>a+b,0),fmt=x=>x.toLocaleString('fr-FR',{maximumFractionDigits:2});app.innerHTML='<section class="panel"><h2>Bilan du brevet blanc</h2><div class="score">'+fmt(score)+'/20</div><p>Automatismes : '+fmt(points.slice(0,6).reduce((a,b)=>a+b,0))+'/6 · Problèmes : '+fmt(points.slice(6).reduce((a,b)=>a+b,0))+'/14</p><p class="math-note">Note indicative sur les réponses saisies. Compare également tes démonstrations écrites au corrigé.</p><div class="buttons"><button id="restart">Nouveau sujet</button><button id="back" class="secondary">Retour</button></div></section><section class="panel"><h2>Correction détaillée</h2>'+M.qs.map((Q,i)=>'<article class="answer-card"><h3>'+esc(Q.title)+' <span class="'+(points[i]===Q.points?'good':'bad')+'">'+fmt(points[i])+'/'+Q.points+'</span></h3><p>'+esc(Q.t)+'</p>'+scratchHtml(Q)+'<p>Ta réponse : '+esc(M.answers[i]?.join(' ; ')||'non répondue')+'</p><p>Attendu : '+esc(Q.expected.join(' ; '))+'</p><p>'+esc(Q.solution)+'</p></article>').join('')+'</section>';$('restart').onclick=()=>{if(confirm('Remplacer la simulation ?'))start()};$('back').onclick=landing}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&M&&!M.finished&&$('examTime'))tick()});window.addEventListener('beforeunload',e=>{if(storageFailed&&M&&!M.finished){e.preventDefault();e.returnValue=''}});
landing();
</script></body></html>
