function make(w,i){

 if(i===0){let m=pick([2,3,5,7]),n=m+1;return q('Simplifier '+(m*k)+'/'+(n*k)+' en fraction irréductible.',fr(m,n),'Diviser le numérateur et le dénominateur par '+k+'.','Cherche un diviseur commun.','frac')}

 if(i===0)return q('ABC est rectangle en A. AB = '+u+' cm et AC = '+v+' cm. Calculer BC en cm.',h,'BC² = '+u+'² + '+v+'² = '+h*h+'.','Repère l’hypoténuse.','num',['BC (cm)'],tri(u,v,'?'));

 if(i===2)return q('Un triangle a pour côtés '+u+', '+v+' et '+h+' cm. Est-il rectangle ? Justifier sur ton brouillon.','oui','Le plus grand côté vérifie '+h+'² = '+u+'² + '+v+'². Réciproque de Pythagore.','Compare le carré du plus grand côté à la somme des deux autres carrés.','yn');

if(w===2){

 if(i===2)return q('D ∈ [AB] et E ∈ [AC]. AD = '+a+', AB = '+a*k+', AE = '+b+', AC = '+b*k+' cm. (DE) et (BC) sont-elles parallèles ? Justifier sur ton brouillon.','oui','AD/AB = AE/AC = 1/'+k+' : réciproque de Thalès.','Compare AD/AB et AE/AC.','yn',['Réponse'],thal(false));
 return q('D ∈ [AB] et E ∈ [AC]. AD = '+a+', AB = '+a*k+', AE = '+b+', AC = '+(b*k+1)+' cm. (DE) et (BC) sont-elles parallèles ? Justifier sur ton brouillon.','non','AD/AB et AE/AC sont différents : contraposée de Thalès.','Compare les deux rapports.','yn',['Réponse'],thal(false))
}
if(w===3){let angle=pick([25,30,35,40,45,50,55,60,65]), h=rand(8,24),adj=rand(4,17),opp=rand(3,14),r=angle*Math.PI/180;
 if(i===0)return q('ABC est rectangle en A. BC = '+h+' cm, angle ACB = '+angle+'°. Calculer AB en cm, arrondi au dixième.',rnd(h*Math.sin(r)),'AB = '+h+' × sin('+angle+'°).','Sinus : opposé / hypoténuse.','num',['AB (cm)'],tri('?', '',h,angle+'°'));

let A=i===0?1:a,B=b;

  if(i===2)return q('Calculer '+a+'/'+b+' × ('+s*c+'/'+(a*k)+'). Donner le résultat irréductible.',fr(s*c,b*k),'Simplifier le facteur commun '+a+', puis réduire.','Simplifie avant de multiplier.','frac');

function approach(value,target,step){return value<target?Math.min(value+step,target):Math.max(value-step,target)}
function motionStep(x,v,move,dt,max,dash=0){const target=dash||move*8.4;v=approach(v,target,(dash?4.8:move?2.1:2.8)*dt);let pos=Math.max(50,Math.min(max,x+v*dt));return {x:pos,v:pos===50||pos===max?0:v}}
function enemyMotion(w,x,foe,t,A,T,dt,min,max){
 let dist=Math.abs(x-foe),dir=Math.sign(x-foe)||1,speed=T.speed,preferred=[105,105,205,225,95,160][w],step=0;
 if(A.warning)return foe;
 if(w===0){step=dir*speed*(dist>preferred?1.55:0);if(dist<65)step=-dir*speed}
 if(w===1)step=dist>preferred?dir*speed*.8:0;
 if(w===2||w===3){step=dist>preferred+25?dir*speed:dist<preferred-35?-dir*speed*.7:0}
 if(w===4)step=dist>preferred?dir*speed*(1.15+.35*Math.sin(t/160)):0;
 if(w===5){let phase=bossPhase(A,w,3);step=dist>preferred?dir*speed*(1+.18*phase):dist<85?-dir*speed*.8:0}
 return Math.max(min,Math.min(max,foe+step*dt))
}

function shuffledProof(a){let b=a.map((label,i)=>({label,i}));for(let j=b.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[b[j],b[k]]=[b[k],b[j]]}return b}
function proofScore(values){return values.reduce((n,v)=>n+Number(v==='0'),0)}
const freeWritingMenu=writingMenu,freeWritingExercise=writingExercise;
writingMenu=function(){notebook.innerHTML='<h2>Atelier de démonstration</h2><p>Complète chaque étape avec l’une des quatre propositions. Valide la démonstration entière, puis corrige tes erreurs. Activité facultative, sans effet sur la note du devoir.</p><div class="village-choice">'+writingExamples.map((e,i)=>{let p=store.proofs?.[i];return '<button class="secondary" data-writing="'+i+'">'+esc(e.name)+(p?' · '+p.best+'/'+proofBank[i].blanks.length:'')+'</button>'}).join('')+'</div><div class="buttons"><button id="writingFree" class="secondary">Rédaction libre</button><button id="writingBack">Carnet</button></div>';$('writingBack').onclick=notebookView;$('writingFree').onclick=freeWritingMenu;notebook.querySelectorAll('[data-writing]').forEach(b=>b.onclick=()=>proofExercise(Number(b.dataset.writing)))};
function proofExercise(i){let E=writingExamples[i],P=proofBank[i];let order=P.blanks.map(shuffledProof),attempt=0,finished=false;
 function blank(n){return '<span class="proof-blank"><select class="proof-choice" aria-label="Trou '+(n+1)+'" id="proof'+n+'"><option value="">Choisir…</option>'+order[n].map(o=>'<option value="'+o.i+'">'+esc(o.label)+'</option>').join('')+'</select><small id="proofFeedback'+n+'" class="proof-feedback"></small></span>'}
 notebook.innerHTML='<h2>'+esc(E.name)+'</h2><p class="proof-task">'+esc(E.task)+'</p><div class="proof-paper">'+P.lines.map((l,j)=>'<div class="proof-line"><span class="proof-number">'+(j+1)+'</span><div>'+esc(l).replace(/\{(\d+)\}/g,(_,n)=>blank(Number(n)))+'</div></div>').join('')+'</div><p id="proofSummary" role="status">Choisis une réponse pour chaque trou.</p><div class="buttons"><button id="proofCheck">Valider la démonstration</button><button id="proofReveal" class="secondary" disabled>Voir la correction complète</button><button id="writingBack" class="secondary">Retour</button></div><div id="proofModel" hidden></div>';
 $('writingBack').onclick=writingMenu;let inputs=P.blanks.map((_,j)=>$('proof'+j));inputs.forEach((s,j)=>s.onchange=()=>{s.classList.remove('proof-wrong');$('proofFeedback'+j).textContent=''});
 $('proofCheck').onclick=()=>{if(finished)return;let values=inputs.map(s=>s.value);if(values.includes('')){$('proofSummary').textContent='Complète tous les trous avant de valider.';inputs[values.indexOf('')].focus();return}attempt++;let score=proofScore(values);store.proofs=store.proofs||{};let prior=store.proofs[i]||{best:0};store.proofs[i]={best:Math.max(prior.best,score),last:score,attempt,day:dayKey()};save();
 inputs.forEach((s,j)=>{let ok=values[j]==='0';s.classList.toggle('proof-right',ok);s.classList.toggle('proof-wrong',!ok);s.disabled=ok;$('proofFeedback'+j).textContent=ok?'✓ '+P.why[j]:'À revoir — choisis une autre proposition.'});
 $('proofSummary').textContent=score+'/'+values.length+' étapes correctes. '+(score===values.length?'Démonstration réussie !':'Corrige les choix signalés, puis valide de nouveau.');$('proofReveal').disabled=false;if(score===values.length){finished=true;$('proofCheck').disabled=true;$('proofModel').hidden=false;$('proofModel').innerHTML='<div class="writing-model">'+esc(E.model)+'</div>'}};
 $('proofReveal').onclick=()=>{finished=true;inputs.forEach((s,j)=>{s.value='0';s.disabled=true;s.classList.remove('proof-wrong');s.classList.add('proof-right');$('proofFeedback'+j).textContent=P.why[j]});$('proofCheck').disabled=true;$('proofReveal').disabled=true;$('proofSummary').textContent='Correction affichée. Les réponses révélées ne comptent pas comme réussites.';$('proofModel').hidden=false;$('proofModel').innerHTML='<div class="writing-model">'+esc(E.model)+'</div>'}
}

function errorAdvice(Q,answers){

  const wrong=Q.expected.findIndex((e,j)=>questionFraction({kind:'proof',expected:[e]},[answers?.[j]])<1);
  if(wrong>=0){
   let label=Q.labels[wrong]||'',given=String(answers?.[wrong]||'');

   if(/produit en croix|carré du plus grand|somme des carrés/i.test(label))return 'Refais les deux calculs séparément, sans arrondir. Compare-les ensuite.';
   if(/isole|remplace|pour calculer|vaut/i.test(label))return 'Écris la relation littérale, remplace les longueurs connues, puis isole l’inconnue en respectant les opérations.';
   if(/conclusion/i.test(label))return 'Ta conclusion doit répondre exactement à la question et découler de la propriété choisie.';
   if(/donc/i.test(label))return w===1?'Après avoir obtenu le carré de la longueur, prends sa racine carrée et vérifie l’unité.':w===3?'Vérifie que la calculatrice est en degrés et n’arrondis qu’à la fin.':'Contrôle ton produit en croix et l’ordre de grandeur de la longueur.';
