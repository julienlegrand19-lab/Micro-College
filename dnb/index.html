}
if(w===3){let angle=pick([25,30,35,40,45,50,55,60,65]), h=rand(8,24),adj=rand(4,17),opp=rand(3,14),r=angle*Math.PI/180;
 if(i===0)return q('ABC est rectangle en A. BC = '+h+' cm, angle ACB = '+angle+'°. Calculer AB en cm, arrondi au dixième.',rnd(h*Math.sin(r)),'AB = '+h+' × sin('+angle+'°).','Sinus : opposé / hypoténuse.','num',['AB (cm)'],tri('?', '',h,angle+'°'));

make=function(w,i){return Math.random()<.5?baseMake(w,i):alternate(w,i)};

function normalize(v){return String(v??'').trim().replace(/−/g,'-').replace(/,/g,'.').replace(/\s/g,'').toLowerCase()}
function correct(Q,ans){if(!Array.isArray(ans)||ans.length!==Q.expected.length)return false;return Q.expected.every((e,i)=>{const a=normalize(ans[i]);if(!a)return false;if(Q.kind==='yn')return a===e;if(Q.kind==='frac'){const m=a.match(/^([+-]?\d+)(?:\/([1-9]\d*))?$/);if(!m)return false;const n=Number(m[1]),d=Number(m[2]||1);return gcd(n,d)===1&&fr(n,d)===String(e)}return /^[-+]?\d+(?:\.\d+)?$/.test(a)&&Math.abs(Number(a)-Number(e))<1e-8})}
function expected(Q){return Q.expected.join(' ; ').replace(/\./g,',')}
function build(w){return Array.from({length:4},(_,i)=>({...make(w,i),w,i}))}
function makeHomework(){return worlds.flatMap((_,w)=>build(w))}

function onlineLogin(){stopExplore();stopCinema();cancelAnimationFrame(animation);app.innerHTML='<section class="panel"><h2>Devoir DNB — Mode classe</h2><p>Utilise uniquement le pseudo et le mot de passe distribués par ton professeur. Ton sujet et tes réponses sont enregistrés sur le serveur.</p><label for="onlineName">Pseudo</label><input id="onlineName" maxlength="24" autocomplete="username"><label for="onlinePass">Mot de passe</label><input id="onlinePass" type="password" maxlength="128" autocomplete="current-password"><div class="buttons"><button id="onlineStart">Se connecter</button><button id="onlineBack" class="secondary">Retour</button></div><p id="onlineNotice" role="status"></p></section>';$('onlineBack').onclick=home;$('onlineStart').onclick=async()=>{if(onlineBusy)return;let b=$('onlineStart'),n=$('onlineNotice'),name=$('onlineName').value.trim(),password=$('onlinePass').value;if(!name||!password){n.textContent='Complète tes identifiants.';return}onlineBusy=true;b.disabled=true;n.textContent='Vérification du service…';try{let health=await dnbApi('/health');if(!health.configured||health.dnb!==1)throw Error('Le mode classe DNB n’est pas encore activé par le professeur.');let d=await dnbApi('/student/login','POST',{name,password});onlineToken=d.token;$('onlinePass').value='';let attempt=await dnbApi('/student/dnb/start','POST',{});onlineCurrent=onlineSession(attempt);session=onlineCurrent;syncStatus('Connecté · '+session.student);session.finished?results():render()}catch(e){onlineToken='';n.textContent=e.message;b.disabled=false}finally{onlineBusy=false}}}
async function onlineLaunch(){if(onlineCurrent&&onlineToken){await flushOnline();session=onlineCurrent;session.finished?results():render();return}onlineLogin()}
const localHome9=home;home=function(){localHome9();if(!onlineRequested)return;let hw=$('hw');if(hw){hw.textContent=onlineCurrent?(onlineCurrent.finished?'Voir le devoir remis':'Reprendre le devoir en ligne'):'Devoir de vacances · mode classe';hw.onclick=onlineLaunch}let p=app.querySelector('.panel');if(p){let t=document.createElement('p');t.className='muted';t.textContent='Mode classe : sujet individuel et remise au serveur. Si le service n’est pas activé, contacte ton professeur.';p.append(t);if(onlineToken){let b=document.createElement('button');b.className='secondary';b.textContent='Déconnexion classe';b.onclick=async()=>{await flushOnline();if(onlineFailure){alert('Sauvegarde non confirmée. Réessaie avant de quitter.');return}try{await dnbApi('/student/logout','POST',{})}catch(e){alert('Déconnexion serveur non confirmée.');return}onlineToken='';onlineCurrent=null;syncStatus('Mode classe DNB');home()};p.append(b)}}};
const localConfirm9=confirmFinish;confirmFinish=function(){let S=session;if(!S?.online){localConfirm9();return}localConfirm9();let submit=$('submit');if(!submit)return;submit.onclick=async()=>{if(onlineBusy)return;onlineBusy=true;submit.disabled=true;syncStatus('Remise en cours…');try{await flushOnline();clearTimeout(onlineTimer);onlinePending=null;let d=await dnbApi('/student/dnb/submit','POST',onlinePayload(S));onlineFailure='';onlineCurrent=onlineSession(d);session=onlineCurrent;syncStatus('Devoir remis au serveur');results()}catch(e){onlineFailure=e.message;syncStatus('⚠ Remise non confirmée');let p=document.createElement('p');p.className='bad';p.textContent=e.message+' — Réessaie sans fermer la page.';submit.after(p);submit.disabled=false}finally{onlineBusy=false}}};
const localResults9=results;results=function(){let S=session;localResults9();if(S?.online&&S.finished){let p=document.createElement('p');p.className='dnb-report';p.textContent='✓ Remise confirmée par le serveur · résultat transmis au professeur.';app.querySelector('.panel')?.prepend(p)}};
addEventListener('beforeunload',e=>{if(onlineRequested&&(onlinePending||onlineFailure)){e.preventDefault();e.returnValue=''}});

let full=document.createElement('button');full.className='secondary fullbtn';full.textContent='⛶ Plein écran';full.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else full.textContent='Plein écran indisponible'}catch(e){full.textContent='Plein écran indisponible'}};$('access').after(full);
})();

if(selfTest())home();else app.textContent='Erreur de vérification interne : contactez le professeur.';
</script></body></html>
