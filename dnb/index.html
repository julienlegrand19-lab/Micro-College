function tri(a,b,c,angle=''){return '<svg viewBox="0 0 310 205" width="310" role="img" aria-label="Triangle ABC rectangle en A, schéma non à l’échelle"><path d="M45 155 L45 35 L270 155 Z M45 141 H59 V155"/><text x="26" y="174">A</text><text x="26" y="27">B</text><text x="276" y="174">C</text><text x="8" y="95">'+esc(a)+'</text><text x="140" y="178">'+esc(b)+'</text><text x="155" y="83">'+esc(c)+'</text>'+(angle?'<text x="222" y="146">'+esc(angle)+'</text>':'')+'<text x="60" y="196" style="font-size:10px">Schéma non à l’échelle</text></svg>'}
function thal(bow){return bow?'<svg viewBox="0 0 300 180" width="300" role="img" aria-label="A D B et C D E alignés, AC et BE parallèles"><path d="M45 32 L255 148 M45 148 L255 32 M45 32 V148 M255 32 V148"/><text x="23" y="28">A</text><text x="23" y="164">C</text><text x="144" y="82">D</text><text x="263" y="164">B</text><text x="263" y="28">E</text><text x="90" y="174" style="font-size:10px">Schéma non à l’échelle</text></svg>':'<svg viewBox="0 0 300 190" width="300" role="img" aria-label="Triangle ABC, D sur AB, E sur AC"><path d="M150 20 L30 160 H270 Z M90 90 H210"/><text x="145" y="15">A</text><text x="13" y="175">B</text><text x="276" y="175">C</text><text x="70" y="88">D</text><text x="218" y="88">E</text><text x="90" y="184" style="font-size:10px">Schéma non à l’échelle</text></svg>'}
function make(w,i){

 if(i===1){let e=rand(2,5),f=e+1,op=pick([1,-1]);return q('Calculer '+a+'/'+e+' '+(op===1?'+':'−')+' '+b+'/'+f+'. Donner le résultat irréductible.',fr(a*f+op*b*e,e*f),'Mettre au même dénominateur '+e*f+', puis simplifier.','Cherche un dénominateur commun.','frac')}

 return q('Calculer '+a+'/'+b+' ÷ ('+s*c+'/'+d+'). Donner le résultat irréductible.',fr(s*a*d,b*c),'Diviser revient à multiplier par l’inverse.','Inverse la deuxième fraction.','frac')
}
if(w===1){let [u,v,h]=pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25],[9,12,15]]).map(x=>x*k);
 if(i===0)return q('ABC est rectangle en A. AB = '+u+' cm et AC = '+v+' cm. Calculer BC en cm.',h,'BC² = '+u+'² + '+v+'² = '+h*h+'.','Repère l’hypoténuse.','num',['BC (cm)'],tri(u,v,'?'));
 if(i===1)return q('ABC est rectangle en A. BC = '+h+' cm et AB = '+u+' cm. Calculer AC en cm.',v,'AC² = '+h+'² − '+u+'² = '+v*v+'.','Isole le carré du côté recherché.','num',['AC (cm)'],tri(u,'?',h));
 if(i===2)return q('Un triangle a pour côtés '+u+', '+v+' et '+h+' cm. Est-il rectangle ? Justifier sur ton brouillon.','oui','Le plus grand côté vérifie '+h+'² = '+u+'² + '+v+'². Réciproque de Pythagore.','Compare le carré du plus grand côté à la somme des deux autres carrés.','yn');

}

 if(i===0)return q('D ∈ [AB], E ∈ [AC] et (DE) ∥ (BC). AD = '+a+' cm, AB = '+a*k+' cm, BC = '+b*k+' cm. Calculer DE en cm.',b,'DE/BC = AD/AB = 1/'+k+'.','Écris les rapports de Thalès.','num',['DE (cm)'],thal(false));

 if(i===2)return q('D ∈ [AB] et E ∈ [AC]. AD = '+a+', AB = '+a*k+', AE = '+b+', AC = '+b*k+' cm. (DE) et (BC) sont-elles parallèles ? Justifier sur ton brouillon.','oui','AD/AB = AE/AC = 1/'+k+' : réciproque de Thalès.','Compare AD/AB et AE/AC.','yn',['Réponse'],thal(false));
 return q('D ∈ [AB] et E ∈ [AC]. AD = '+a+', AB = '+a*k+', AE = '+b+', AC = '+(b*k+1)+' cm. (DE) et (BC) sont-elles parallèles ? Justifier sur ton brouillon.','non','AD/AB et AE/AC sont différents : contraposée de Thalès.','Compare les deux rapports.','yn',['Réponse'],thal(false))

const scoreThemes=[
 {bpm:108,notes:[57,64,69,67,64,60,62,64,55,62,67,64,62,59,60,0],bass:[45,45,43,43],wave:'sine'},
 {bpm:90,notes:[50,57,62,65,62,57,53,0,48,55,60,64,60,55,57,0],bass:[38,38,36,36],wave:'triangle'},
 {bpm:116,notes:[53,56,60,61,60,56,55,0,51,55,58,60,58,55,53,0],bass:[41,41,39,39],wave:'triangle'},
 {bpm:82,notes:[60,67,72,76,74,72,67,0,59,65,71,74,72,67,65,0],bass:[48,48,47,47],wave:'sine'},
 {bpm:130,notes:[48,55,60,55,51,58,63,58,46,53,58,53,43,50,55,0],bass:[36,39,34,31],wave:'triangle'},
 {bpm:100,notes:[57,60,64,68,67,64,60,0,56,59,63,67,65,63,59,0],bass:[45,45,44,44],wave:'sine'}
];
const actors={
 'Lyra':{character:'scout',outfit:'#76bfd4',skin:'#e3b58f',hair:'#583d40'},
 'Orion':{character:'ranger',outfit:'#b7a16b',skin:'#bc8d66',hair:'#493b30'},
 'Nahla':{character:'mage',outfit:'#e2ad68',skin:'#a57250',hair:'#332834'},
 'Bram':{character:'knight',outfit:'#b37b61',skin:'#ce9b73',hair:'#634032'},
 'Vesper':{character:'mage',outfit:'#76599e',skin:'#c0b9d1',hair:'#342542'}
};
let musicTimer=0,musicWorld=0,musicMode='quiet',musicStep=0,musicNext=0,musicContext=null,musicMaster=null,cinemaFrame=0;
function musicStop(){if(musicTimer){clearInterval(musicTimer);musicTimer=0}if(musicMaster&&musicContext){try{musicMaster.gain.cancelScheduledValues(musicContext.currentTime);musicMaster.gain.setTargetAtTime(0,musicContext.currentTime,.045)}catch(e){}}}
function musicNote(midi,start,duration,volume,wave){if(!midi||!musicContext||!musicMaster)return;let ctx=musicContext,o=ctx.createOscillator(),g=ctx.createGain();o.type=wave;o.frequency.value=440*2**((midi-69)/12);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(volume,start+.035);g.gain.exponentialRampToValueAtTime(.0001,start+duration);o.connect(g);g.connect(musicMaster);o.start(start);o.stop(start+duration+.01)}
function musicTick(){if(!musicContext||musicContext.state!=='running'||document.hidden)return;let M=scoreThemes[musicWorld],interval=60/(M.bpm*(musicMode==='boss'?1.22:1))/2;if(musicNext<musicContext.currentTime)musicNext=musicContext.currentTime+.04;while(musicNext<musicContext.currentTime+.14){let i=musicStep%16;musicNote(M.notes[i],musicNext,interval*.93,.045,M.wave);if(i%4===0)musicNote(M.bass[Math.floor(i/4)],musicNext,interval*3.8,.038,'sine');if(musicMode==='boss'&&i%2===0)musicNote(M.bass[Math.floor(i/4)]-12,musicNext,.19,.035,'triangle');musicNext+=interval;musicStep++}}
async function musicStart(){if(!store.sound||document.hidden||musicTimer)return;try{const A=globalThis.AudioContext||globalThis.webkitAudioContext;if(!A)return;if(!musicContext){musicContext=new A();musicMaster=musicContext.createGain();musicMaster.gain.value=0;musicMaster.connect(musicContext.destination)}await musicContext.resume();if(!store.sound||document.hidden||musicTimer)return;musicMaster.gain.setTargetAtTime(.75,musicContext.currentTime,.07);musicNext=musicContext.currentTime+.05;musicTimer=setInterval(musicTick,65);musicTick()}catch(e){}}
function musicTheme(w,mode){if(w!==musicWorld||mode!==musicMode){musicWorld=w;musicMode=mode;musicStep=0}if(store.sound)musicStart()}
document.addEventListener('visibilitychange',()=>document.hidden?musicStop():musicStart());addEventListener('pagehide',musicStop);document.addEventListener('click',()=>{if(store.sound)musicStart();else musicStop()});
function speakerCard(el,who,line){if(!el)return;let name=who.split(',')[0].trim(),actor=actors[name]||actors.Lyra;el.classList.add('dialog-cast');el.innerHTML='<canvas width="96" height="114" aria-hidden="true"></canvas><div><strong>'+esc(who)+'</strong><p class="line-in">'+esc(line)+'</p></div>';let g=el.querySelector('canvas').getContext('2d');if(g&&globalThis.MicroHeroes){let gr=g.createLinearGradient(0,0,96,114);gr.addColorStop(0,'#1b2b45');gr.addColorStop(1,'#40516a');g.fillStyle=gr;g.fillRect(0,0,96,114);MicroHeroes.draw(g,{...actor,x:48,y:139,scale:1.75,time:120,pose:'idle'})}}
function stopCinema(){cancelAnimationFrame(cinemaFrame);cinemaFrame=0}
function cinematicTransition(S,oldQ,newQ,launch){stopExplore();cancelAnimationFrame(animation);stopCinema();let w=oldQ.w,next=newQ.w,mode=S.mode==='hw',done=sagaCompleted(S,w);musicTheme(next,'quiet');app.innerHTML='<section class="story-chaptercard cinema-enter"><div class="story-ep">Interlude · '+esc(saga[w].title)+'</div><h2>'+esc(done?'Le passage s’ouvre':'Le voyage continue')+'</h2><div class="cinema-frame"><canvas id="cutscene" width="840" height="320" aria-hidden="true"></canvas><div class="cinema-title">'+esc(saga[next].title)+'</div><div class="cinema-sub">Destination : '+esc(themes[next][1])+'</div></div><div id="cutdialog" class="story-banner"></div><div class="buttons"><button id="cutnext">Entrer dans le territoire</button><button class="secondary" id="cutleave">Sauvegarder et quitter</button></div></section>';speakerCard($('cutdialog'),saga[w].npc,saga[w].out);let canvas=$('cutscene'),start=performance.now(),last=0;function frame(t){if(!canvas.isConnected)return;if(!last||t-last>50){drawCanvas(canvas,next,reduced?0:t,true,{effect:reduced?'':'neutral',start});last=t}if(!reduced)cinemaFrame=requestAnimationFrame(frame)}frame(start);$('cutnext').onclick=()=>{stopCinema();tone(540,.18);launch()};$('cutleave').onclick=()=>{stopCinema();keep();home()}}
const storyRender=render,storyHome=home,storyResults=results,storyConfirm=confirmFinish;
render=function(){
 stopCinema();const S=session,Q=S.qs[S.at],w=Q.w;
 musicTheme(w,Q.i===3?'boss':'explore');storyRender();
 if(exploring){speakerCard(app.querySelector('.explore-dialog'),saga[w].npc,Q.i===0?saga[w].intro:storyLine(Q));return}
 speakerCard(app.querySelector('.story-banner'),Q.i===3?themes[w][0]:saga[w].npc,storyLine(Q));
 const next=$('next');if(next&&S.mode==='hw'&&Q.i===3&&S.at<S.qs.length-1){let old=next.onclick;next.onclick=()=>{const newQ=S.qs[S.at+1];S.at++;S.checked=false;S.hint=false;keep();cinematicTransition(S,Q,newQ,()=>{activeEncounter='';render()})}}
 if(Q.i===3){let title=app.querySelector('.panel>h2');if(title){let b=document.createElement('span');b.className='quest-badge';b.textContent='✦ GARDIEN DU SCEAU';title.before(b)}}
};
home=function(){stopCinema();musicTheme(0,'quiet');storyHome()};
results=function(){stopCinema();musicTheme(5,'quiet');storyResults()};
confirmFinish=function(){stopCinema();musicTheme(5,'quiet');storyConfirm()};
const globalSound=document.createElement('button');globalSound.className='secondary sound-global';function soundLabel(){globalSound.textContent=store.sound?'♪ Son activé':'♪ Son coupé'}soundLabel();globalSound.onclick=()=>{store.sound=!store.sound;save();soundLabel();if(store.sound){musicStart();tone(440,.13)}else musicStop()};$('access').after(globalSound);
document.addEventListener('click',()=>soundLabel());

let full=document.createElement('button');full.className='secondary fullbtn';full.textContent='⛶ Plein écran';full.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else full.textContent='Plein écran indisponible'}catch(e){full.textContent='Plein écran indisponible'}};$('access').after(full);
})();

if(selfTest())home();else app.textContent='Erreur de vérification interne : contactez le professeur.';
</script></body></html>
