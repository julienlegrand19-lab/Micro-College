<style>

v .current{outline:2px solid var(--gold)}table{width:100%;border-collapse:collapse;font-size:15px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}td:last-child{text-align:right}details{margin-top:12px}footer{margin:22px 0;color:var(--muted);font-size:13px}body.easy{font-family:Arial,sans-serif;letter-spacing:.035em;line-height:1.8}body.easy .question{font-size:25px}svg{max-width:100%;height:auto;display:block;margin:15px auto;background:#eef3f8;border-radius:12px}svg text{fill:#172538;font-size:15px;font-weight:bold}svg path,svg line{stroke:#243b53;stroke-width:2;fill:none}#notice{min-height:1.5em;color:#ffcb9c}
</style></head><body><main><header><div class="tag">Collège • Mathématiques • 3e</div><h1>Les Gardiens du Savoir</h1><p>DNB 2027 — Six territoires à reconquérir</p><button class="secondary" id="access">Lecture aérée</button></header><div id="app"></div><footer>Version 0.1 • Entraînement et devoir pilote • Sans compte ni envoi automatique de données.</footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id), app=$('app'), key='gardiens-dnb-v1';
const worlds=[['⚔️','Le royaume fragmenté','Fractions',4],['⛰️','Les montagnes de Pythagore','Pythagore',3],['🏛️','Les ruines de Thalès','Thalès',3],['🔭','L’observatoire des angles','Trigonométrie',4],['⚒️','Les forges de l’algèbre','Double distributivité',3],['🔮','La citadelle des identités','Identités remarquables',3]];
let store={wins:{},hw:null,easy:false};try{const saved=localStorage.getItem(key);if(saved)store={...store,...JSON.parse(saved)}}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify(store));return true}catch(e){return false}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), pick=a=>a[rand(0,a.length-1)], gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a), rnd=x=>Math.round(x*10)/10;
const fr=(n,d)=>{let g=gcd(n,d);return d/g===1?String(n/g):n/g+'/'+d/g}, sign=n=>n<0?'− '+Math.abs(n):'+ '+n, bin=(a,b)=>'('+ (a===1?'x':a+'x')+' '+sign(b)+')';
function q(t,expected,solution,hint,kind='num',labels=['Réponse'],diagram=''){return {t,expected:Array.isArray(expected)?expected:[expected],solution,hint,kind,labels,diagram}}
function tri(a,b,c,angle=''){return '<svg viewBox="0 0 310 205" width="310" role="img" aria-label="Triangle ABC rectangle en A, schéma non à l’échelle"><path d="M45 155 L45 35 L270 155 Z M45 141 H59 V155"/><text x="26" y="174">A</text><text x="26" y="27">B</text><text x="276" y="174">C</text><text x="8" y="95">'+esc(a)+'</text><text x="140" y="178">'+esc(b)+'</text><text x="155" y="83">'+esc(c)+'</text>'+(angle?'<text x="222" y="146">'+esc(angle)+'</text>':'')+'<text x="60" y="196" style="font-size:10px">Schéma non à l’échelle</text></svg>'}
function thal(bow){return bow?'<svg viewBox="0 0 300 180" width="300" role="img" aria-label="A D B et C D E alignés, AC et BE parallèles"><path d="M45 32 L255 148 M45 148 L255 32 M45 32 V148 M255 32 V148"/><text x="23" y="28">A</text><text x="23" y="164">C</text><text x="144" y="82">D</text><text x="263" y="164">B</text><text x="263" y="28">E</text><text x="90" y="174" style="font-size:10px">Schéma non à l’échelle</text></svg>':'<svg viewBox="0 0 300 190" width="300" role="img" aria-label="Triangle ABC, D sur AB, E sur AC"><path d="M150 20 L30 160 H270 Z M90 90 H210"/><text x="145" y="15">A</text><text x="13" y="175">B</text><text x="276" y="175">C</text><text x="70" y="88">D</text><text x="218" y="88">E</text><text x="90" y="184" style="font-size:10px">Schéma non à l’échelle</text></svg>'}
function make(w,i){
let a=rand(2,7),b=rand(2,8),c=rand(2,6),d=rand(2,9),s=pick([-1,1]),t=pick([-1,1]); let k=rand(2,5);
if(w===0){
 if(i===0){let m=pick([2,3,5,7]),n=m+1;return q('Simplifier '+(m*k)+'/'+(n*k)+' en fraction irréductible.',fr(m,n),'Diviser le numérateur et le dénominateur par '+k+'.','Cherche un diviseur commun.','frac')}
 if(i===1){let e=rand(2,5),f=e+1,op=pick([1,-1]);return q('Calculer '+a+'/'+e+' '+(op===1?'+':'−')+' '+b+'/'+f+'. Donner le résultat irréductible.',fr(a*f+op*b*e,e*f),'Mettre au même dénominateur '+e*f+', puis simplifier.','Cherche un dénominateur commun.','frac')}
 if(i===2)return q('Calculer ('+s*a+'/'+b+') × '+c+'/'+d+'. Donner le résultat irréductible.',fr(s*a*c,b*d),'Multiplier les numérateurs et les dénominateurs, puis simplifier.','Multiplie séparément numérateurs et dénominateurs.','frac');
 return q('Calculer '+a+'/'+b+' ÷ ('+s*c+'/'+d+'). Donner le résultat irréductible.',fr(s*a*d,b*c),'Diviser revient à multiplier par l’inverse.','Inverse la deuxième fraction.','frac')
}
if(w===1){let [u,v,h]=pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25],[9,12,15]]).map(x=>x*k);
 if(i===0)return q('ABC est rectangle en A. AB = '+u+' cm et AC = '+v+' cm. Calculer BC en cm.',h,'BC² = '+u+'² + '+v+'² = '+h*h+'.','Repère l’hypoténuse.','num',['BC (cm)'],tri(u,v,'?'));
 if(i===1)return q('ABC est rectangle en A. BC = '+h+' cm et AB = '+u+' cm. Calculer AC en cm.',v,'AC² = '+h+'² − '+u+'² = '+v*v+'.','Isole le carré du côté recherché.','num',['AC (cm)'],tri(u,'?',h));
 if(i===2)return q('Un triangle a pour côtés '+u+', '+v+' et '+h+' cm. Est-il rectangle ? Justifier sur ton brouillon.','oui','Le plus grand côté vérifie '+h+'² = '+u+'² + '+v+'². Réciproque de Pythagore.','Compare le carré du plus grand côté à la somme des deux autres carrés.','yn');
 return q('Un triangle a pour côtés '+u+', '+v+' et '+(h+1)+' cm. Est-il rectangle ? Justifier sur ton brouillon.','non','Les carrés sont différents : '+(h+1)**2+' ≠ '+(u*u+v*v)+'. Contraposée de Pythagore.','Teste l’égalité de Pythagore.','yn')
}
if(w===2){
 if(i===0)return q('D ∈ [AB], E ∈ [AC] et (DE) ∥ (BC). AD = '+a+' cm, AB = '+a*k+' cm, BC = '+b*k+' cm. Calculer DE en cm.',b,'DE/BC = AD/AB = 1/'+k+'.','Écris les rapports de Thalès.','num',['DE (cm)'],thal(false));
 if(i===1)return q('Les points A, D, B et C, D, E sont alignés dans cet ordre. (AC) ∥ (BE). AD = '+a+' cm, DB = '+a*k+' cm, DC = '+b+' cm. Calculer DE en cm.',b*k,'AD/DB = DC/DE = 1/'+k+'.','Dans le nœud papillon, repère les côtés correspondants.','num',['DE (cm)'],thal(true));
 if(i===2)return q('D ∈ [AB] et E ∈ [AC]. AD = '+a+', AB = '+a*k+', AE = '+b+', AC = '+b*k+' cm. (DE) et (BC) sont-elles parallèles ? Justifier sur ton brouillon.','oui','AD/AB = AE/AC = 1/'+k+' : réciproque de Thalès.','Compare AD/AB et AE/AC.','yn',['Réponse'],thal(false));
 return q('D ∈ [AB] et E ∈ [AC]. AD = '+a+', AB = '+a*k+', AE = '+b+', AC = '+(b*k+1)+' cm. (DE) et (BC) sont-elles parallèles ? Justifier sur ton brouillon.','non','AD/AB et AE/AC sont différents : contraposée de Thalès.','Compare les deux rapports.','yn',['Réponse'],thal(false))
}
if(w===3){let angle=pick([25,30,35,40,45,50,55,60,65]), h=rand(8,24),adj=rand(4,17),opp=rand(3,14),r=angle*Math.PI/180;
 if(i===0)return q('ABC est rectangle en A. BC = '+h+' cm, angle ACB = '+angle+'°. Calculer AB en cm, arrondi au dixième.',rnd(h*Math.sin(r)),'AB = '+h+' × sin('+angle+'°).','Sinus : opposé / hypoténuse.','num',['AB (cm)'],tri('?', '',h,angle+'°'));
 if(i===1)return q('ABC est rectangle en A. BC = '+h+' cm, angle ACB = '+angle+'°. Calculer AC en cm, arrondi au dixième.',rnd(h*Math.cos(r)),'AC = '+h+' × cos('+angle+'°).','Cosinus : adjacent / hypoténuse.','num',['AC (cm)'],tri('', '?',h,angle+'°'));
 if(i===2)return q('ABC est rectangle en A. AC = '+adj+' cm, angle ACB = '+angle+'°. Calculer AB en cm, arrondi au dixième.',rnd(adj*Math.tan(r)),'AB = '+adj+' × tan('+angle+'°).','Tangente : opposé / adjacent.','num',['AB (cm)'],tri('?',adj,'',angle+'°'));
 return q('ABC est rectangle en A. AB = '+opp+' cm, AC = '+adj+' cm. Calculer l’angle ACB en degrés, arrondi au dixième.',rnd(Math.atan(opp/adj)*180/Math.PI),'angle ACB = arctan('+opp+'/'+adj+').','Utilise tan⁻¹ ou arctan en mode degrés.','num',['Angle (°)'],tri(opp,adj,'','?'))
}
if(w===4){let B=s*b,D=t*d;let A=i===0?1:a,C=i<=1?1:c;if(i===3){let e=rand(1,5);return q('Développer et réduire '+bin(A,B)+bin(C,D)+' '+sign(e)+'x². Donner a, b et c dans ax² + bx + c.',[A*C+e,A*D+B*C,B*D],'Produit : chaque terme du premier facteur multiplie chaque terme du second, puis ajouter '+e+'x².','Fais les quatre produits, puis regroupe.','coeff',['a (x²)','b (x)','c (constant)'])}
 return q('Développer et réduire '+bin(A,B)+bin(C,D)+'. Donner a, b et c dans ax² + bx + c.',[A*C,A*D+B*C,B*D],'Quatre produits : '+A*C+'x², '+A*D+'x, '+B*C+'x, '+B*D+'.','Multiplie chaque terme du premier facteur par chaque terme du second.','coeff',['a (x²)','b (x)','c (constant)'])
}
let A=i===0?1:a,B=b;
if(i===0||i===1){let S=i===0?1:-1;return q('Développer '+bin(A,S*B)+'². Donner a, b et c dans ax² + bx + c.',[A*A,2*A*S*B,B*B],'Carré d’une somme ou différence : premier carré, double produit, second carré.','N’oublie pas le double produit.','coeff',['a (x²)','b (x)','c (constant)'])}
if(i===2)return q('Développer '+bin(A,B)+bin(A,-B)+'. Donner a, b et c dans ax² + bx + c.',[A*A,0,-B*B],'Produit d’une somme et d’une différence : différence de deux carrés.','Utilise (u + v)(u − v) = u² − v².','coeff',['a (x²)','b (x)','c (constant)']);
return q('Factoriser x² − '+B*B+'. Compléter (x + a)(x − a) avec a positif.',B,'x² − '+B*B+' = (x + '+B+')(x − '+B+').','Reconnais la différence de deux carrés.','num',['a'])
}
function normalize(v){return String(v??'').trim().replace(/−/g,'-').replace(/,/g,'.').replace(/\s/g,'').toLowerCase()}
function correct(Q,ans){if(!Array.isArray(ans)||ans.length!==Q.expected.length)return false;return Q.expected.every((e,i)=>{const a=normalize(ans[i]);if(!a)return false;if(Q.kind==='yn')return a===e;if(Q.kind==='frac'){const m=a.match(/^([+-]?\d+)(?:\/([1-9]\d*))?$/);if(!m)return false;const n=Number(m[1]),d=Number(m[2]||1);return gcd(n,d)===1&&fr(n,d)===String(e)}return /^[-+]?\d+(?:\.\d+)?$/.test(a)&&Math.abs(Number(a)-Number(e))<1e-8})}
function expected(Q){return Q.expected.join(' ; ').replace(/\./g,',')}
function build(w){return Array.from({length:4},(_,i)=>({...make(w,i),w,i}))}
function makeHomework(){return worlds.flatMap((_,w)=>build(w))}
function selfTest(){const all=makeHomework();return all.length===24&&all.every(Q=>correct(Q,Q.expected.map(String))&&!correct(Q,Q.expected.map(()=>'')))&&worlds.reduce((x,w)=>x+w[3],0)===20}
let session=null;
function home(){session=null;app.innerHTML='<section class="panel"><div class="tag">Choisis ta mission</div><h2>Deviens Gardien du Savoir</h2><p>Entraîne-toi dans les six territoires. Prépare ensuite le devoir noté des vacances.</p><div class="buttons"><button id="hw">'+(store.hw?.finished?'Voir mon devoir terminé':store.hw?'Reprendre mon devoir':'Commencer le devoir de vacances')+'</button></div><p class="muted">Devoir : 24 questions, note /20, sans aide. Prévois du brouillon et une calculatrice pour la géométrie.</p></section><h2>Carte des territoires</h2><div class="grid">'+worlds.map((w,i)=>'<article class="tile"><span class="symbol">'+w[0]+'</span><h3>'+w[1]+'</h3><p>'+w[2]+'</p><p class="muted">'+(store.wins[i]?'🏅 Sceau acquis':'4 épreuves • Sceau à conquérir')+'</p><button data-world="'+i+'">Explorer</button></article>').join('')+'</div>';
$('hw').onclick=homeworkIntro;app.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>{let w=Number(b.dataset.world);session={mode:'train',qs:build(w),answers:Array(4).fill(null),at:0,checked:false,hint:false};render()})}
function homeworkIntro(){if(store.hw){session=store.hw;session.finished?results():render();return}app.innerHTML='<section class="panel"><h2>Devoir de vacances</h2><p>24 questions, quatre dans chacun des six chapitres. Réponses modifiables avant remise. Aucun indice ni corrigé pendant le devoir. Note calculée automatiquement, sur 20.</p><p>La sauvegarde reste sur cet appareil et dans ce navigateur. À la fin, télécharge ton bilan et remets-le à ton professeur par le canal habituel. N’utilise pas ton nom complet ici.</p><label for="student">Code élève communiqué par le professeur (ou initiales)</label><input id="student" maxlength="24" autocomplete="off" placeholder="Ex. E07"><div class="buttons"><button id="start">Commencer</button><button class="secondary" id="back">Retour</button></div><p id="notice"></p></section>';$('back').onclick=home;$('start').onclick=()=>{let student=$('student').value.trim();if(!student){$('notice').textContent='Saisis ton code élève.';return}session={mode:'hw',student,qs:makeHomework(),answers:Array(24).fill(null),at:0,finished:false,created:new Date().toISOString()};store.hw=session;if(!save())alert('Attention : sauvegarde locale indisponible. Ne ferme pas cette page.');render()}}
function keep(){if(session?.mode==='hw'){store.hw=session;save()}}
function render(){const S=session,Q=S.qs[S.at],w=worlds[Q.w],isHW=S.mode==='hw',a=S.answers[S.at]||Q.labels.map(()=>''),checked=!!S.checked&&!isHW;app.innerHTML='<section class="panel"><div class="tag">'+(isHW?'Devoir de vacances':w[0]+' '+esc(w[1]))+'</div><h2>'+esc(w[2])+' — Épreuve '+(Q.i+1)+'/4</h2><p>Question '+(S.at+1)+' / '+S.qs.length+(isHW?' • '+(w[3]/4).toString().replace('.',',')+' point(s)':' • '+S.answers.filter((v,j)=>v&&correct(S.qs[j],v)).length+' réussites')+'</p><progress value="'+(S.at+1)+'" max="'+S.qs.length+'"></progress>'+(isHW?'<div class="qnav">'+S.qs.map((_,j)=>'<button class="secondary '+(S.answers[j]?.every(v=>String(v).trim())?'done ':'')+(j===S.at?'current':'')+'" data-j="'+j+'">'+(j+1)+'</button>').join('')+'</div>':'')+'<div class="question">'+esc(Q.t)+'</div>'+Q.diagram+'<div id="fields">'+(Q.kind==='yn'?'<div class="buttons"><button data-yn="oui" class="'+(a[0]==='oui'?'':'secondary')+'" '+(checked?'disabled':'')+'>Oui</button><button data-yn="non" class="'+(a[0]==='non'?'':'secondary')+'" '+(checked?'disabled':'')+'>Non</button></div>':Q.labels.map((l,i)=>'<label for="a'+i+'">'+esc(l)+'</label><input id="a'+i+'" data-i="'+i+'" value="'+esc(a[i]||'')+'" autocomplete="off" inputmode="text" '+(checked?'disabled':'')+' placeholder="'+(Q.kind==='frac'?'Ex. -3/4 ou 2':'Saisis ta réponse')+'">').join(''))+'</div>'+(S.hint&&!isHW?'<p class="result">'+esc(Q.hint)+'</p>':'')+(checked?'<div class="result"><p class="'+(correct(Q,a)?'good':'bad')+'">'+(correct(Q,a)?'Attaque réussie !':'Le gardien résiste.')+'</p><p>Réponse : '+esc(expected(Q))+'</p><p>'+esc(Q.solution)+'</p></div>':'')+'<div class="buttons">'+(isHW?'<button class="secondary" id="prev" '+(S.at===0?'disabled':'')+'>Précédente</button><button id="next">'+(S.at===23?'Aller au bilan':'Suivante')+'</button><button class="secondary" id="finish">Remettre le devoir</button>':checked?'<button id="next">Continuer</button>':'<button id="check">Attaquer</button><button class="secondary" id="hint">Indice</button>')+'<button class="secondary" id="leave">'+(isHW?'Sauvegarder et quitter':'Carte')+'</button></div><p id="notice" role="status"></p></section>';
function set(i,v){let x=S.answers[S.at]||Q.labels.map(()=> '');x[i]=v;S.answers[S.at]=x;keep()}
app.querySelectorAll('[data-i]').forEach(el=>el.oninput=()=>set(Number(el.dataset.i),el.value));app.querySelectorAll('[data-yn]').forEach(el=>el.onclick=()=>{set(0,el.dataset.yn);render()});app.querySelectorAll('[data-j]').forEach(el=>el.onclick=()=>{S.at=Number(el.dataset.j);keep();render()});
if($('prev'))$('prev').onclick=()=>{S.at--;keep();render()};if($('hint'))$('hint').onclick=()=>{S.hint=true;render()};if($('check'))$('check').onclick=()=>{if(!S.answers[S.at]?.every(v=>String(v).trim())){$('notice').textContent='Complète la réponse avant d’attaquer.';return}S.checked=true;render()};
if($('next'))$('next').onclick=()=>{if(S.at===S.qs.length-1){isHW?confirmFinish():results();return}S.at++;S.checked=false;S.hint=false;keep();render()};if($('finish'))$('finish').onclick=confirmFinish;$('leave').onclick=()=>{keep();home()}}
function confirmFinish(){const S=session,n=S.answers.filter(a=>a?.every(v=>String(v).trim())).length;app.innerHTML='<section class="panel"><h2>Remettre le devoir ?</h2><p>'+n+' / 24 questions complétées.</p><p>La remise clôt le devoir sur cet appareil. Les réponses manquantes valent zéro.</p><div class="buttons"><button id="submit">Confirmer la remise</button><button id="review" class="secondary">Revenir aux questions</button></div></section>';$('review').onclick=render;$('submit').onclick=()=>{S.finished=true;S.submitted=new Date().toISOString();keep();results()}}
function marks(S){return worlds.map((w,i)=>S.qs.reduce((sum,Q,j)=>sum+(Q.w===i&&correct(Q,S.answers[j])?w[3]/4:0),0))}
function fmt(n){return n.toLocaleString('fr-FR',{maximumFractionDigits:2})}
function results(){let S=session,isHW=S.mode==='hw',count=S.qs.filter((Q,j)=>correct(Q,S.answers[j])).length,points=marks(S),total=points.reduce((a,b)=>a+b,0);if(!isHW&&count===4){store.wins[S.qs[0].w]=true;save()}app.innerHTML='<section class="panel"><div class="tag">'+(isHW?'Devoir remis':'Mission terminée')+'</div><h2>'+(isHW?'Ton bilan':count===4?'Sceau conquis !':'Poursuis ton entraînement')+'</h2><div class="score">'+(isHW?fmt(total)+'/20':count+'/4')+'</div>'+(isHW?'<p>Code : '+esc(S.student)+'</p><table><thead><tr><th>Chapitre</th><th>Note</th></tr></thead><tbody>'+worlds.map((w,i)=>'<tr><td>'+w[2]+'</td><td>'+fmt(points[i])+' / '+w[3]+'</td></tr>').join('')+'</tbody></table><p>Remets ton bilan au professeur. Il contient tes réponses et les questions tirées.</p>':'')+'<details><summary>Correction détaillée</summary>'+S.qs.map((Q,j)=>'<p class="result"><strong>Q'+(j+1)+' — '+esc(worlds[Q.w][2])+'</strong><br>'+esc(Q.t)+'<br>Ta réponse : '+esc((S.answers[j]||[]).join(' ; ')||'non répondue')+'<br>Attendu : '+esc(expected(Q))+'<br>'+esc(Q.solution)+'</p>').join('')+'</details><div class="buttons">'+(isHW?'<button id="download">Télécharger mon bilan</button><button class="secondary" id="copy">Copier mon bilan</button>':'')+'<button class="secondary" id="back">Retour à la carte</button></div><p id="notice"></p></section>';$('back').onclick=home;if(isHW){let report=['DNB 2027 — Devoir pilote','Code : '+S.student,'Remis : '+new Date(S.submitted).toLocaleString('fr-FR'),'Note : '+fmt(total)+'/20',...worlds.map((w,i)=>w[2]+' : '+fmt(points[i])+'/'+w[3]),'',...S.qs.map((Q,j)=>'Q'+(j+1)+' — '+Q.t+'\nRéponse : '+((S.answers[j]||[]).join(' ; ')||'non répondue')+'\nAttendu : '+expected(Q)+'\nRésultat : '+(correct(Q,S.answers[j])?'correct':'incorrect'))].join('\n');$('download').onclick=()=>{let a=document.createElement('a');let url=URL.createObjectURL(new Blob([report],{type:'text/plain;charset=utf-8'}));a.href=url;a.download='DNB-devoir-'+S.student.replace(/[^a-zA-Z0-9_-]/g,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report);$('notice').textContent='Bilan copié.'}catch(e){$('notice').textContent='Copie indisponible : utilise le téléchargement.'}}}}
$('access').onclick=()=>{store.easy=!store.easy;document.body.classList.toggle('easy',store.easy);save()};document.body.classList.toggle('easy',store.easy);
if(selfTest())home();else app.textContent='Erreur de vérification interne : contactez le professeur.';
</script></body></html>
